<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>卡波计分 Cabo Scorer</title>
  <style>
    :root{
      --bg:#f3f7f5; --card:#ffffff; --line:#e3eae6; --text:#16302a; --muted:#6b7c75;
      --accent:#2bb673; --accent-2:#1f9e63; --shadow:0 10px 30px rgba(20,60,45,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(1200px 600px at 50% -10%, #e7f5ee 0%, var(--bg) 60%);
      color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      padding:24px}
    .wrap{width:100%;max-width:560px;text-align:center}
    .logo{font-size:46px;line-height:1}
    h1{font-size:26px;margin:14px 0 4px;letter-spacing:.5px}
    .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
    .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:480px){.modes{grid-template-columns:1fr}}
    .mode{display:block;text-decoration:none;color:inherit;background:var(--card);
      border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:left;
      box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
    .mode:hover{transform:translateY(-3px);border-color:var(--accent)}
    .mode .ic{font-size:30px}
    .mode h2{font-size:18px;margin:10px 0 6px}
    .mode p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 14px}
    .mode .go{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent-2);font-size:14px}
    .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));
      padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
    .foot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.7}
    .foot b{color:var(--text)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🃏</div>
    <h1>卡波计分 <span class="badge">Cabo</span></h1>
    <p class="sub">选择使用模式 · 两个版本数据互不干扰，可随时切换</p>

    <div class="modes">
      <a class="mode" href="CABO_v0.2.17.html">
        <div class="ic">📱</div>
        <h2>本地模式</h2>
        <p>离线可用，<b>无需登录</b>。数据存在这部手机的浏览器里，打开即用，最适合当面记分。</p>
        <span class="go">进入本地版 v0.2.17 →</span>
      </a>

      <a class="mode" href="CABO_v0.2.17.1.html">
        <div class="ic">🐙</div>
        <h2>云端模式</h2>
        <p>支持 <b>GitHub 云</b> 或 <b>本机账号</b> 登录。数据随账号保存，换设备也能接着打。</p>
        <span class="go">进入云端版 v0.2.17.1 →</span>
      </a>
    </div>

    <p class="foot">
      本地模式与云端模式是<b>两个独立文件</b>：本地版的对局不会自动进云端，云端版需联网登录。<br>
      想用哪个就点哪个，之后也能从入口随时切回去。
    </p>
  </div>
</body>
</html>
