<style>

 --bg:#eef2f0; --card:#ffffff; --accent:#2bb673; --accent-2:#1f9d5e; --accent-dk:#178a4f;

}

 --bg:#0d1411; --card:#161f1b; --accent:#34d27f; --accent-2:#28b86b; --accent-dk:#1f9d5e;

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;

<body>
<div class="app">
  <header></header>
  <main id="screen"></main>
</div>
<div id="overlay" class="overlay hidden"></div>
<script>
const KEY = "cabo-scorer-v1";
const ADJ_DEFAULT = 10;            // 附加分（惩罚分）默认 +10
let roundAdj = [];                 // 当前这一局各玩家的附加分暂存（提交后随 renderGame 重置）
const screen = document.querySelector("#screen");
const overlay = document.querySelector("#overlay");

let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function defaultState(){
  return {
    started:false,
    players:[{name:"玩家1"},{name:"玩家2"}],
    endScore:100, winRule:"low", rounds:[],
    adjust:[0,0],
    hundredUsed:false,
    bonusApplied:false,
    sound:true,
    theme:"light",
    rules:{
      lowBonus:{enabled:true, amount:10},
      hundredHalf:{enabled:true},
      kamikaze:{enabled:false, threshold:120}
    }
  };
}
if(!state) state = defaultState();

function normalize(){
  if(!state.rules) state.rules = {lowBonus:{enabled:true,amount:10}, hundredHalf:{enabled:true}, kamikaze:{enabled:false, threshold:120}};
  if(!state.rules.lowBonus) state.rules.lowBonus={enabled:true,amount:10};
  if(!state.rules.hundredHalf) state.rules.hundredHalf={enabled:true};
  if(!state.rules.kamikaze) state.rules.kamikaze={enabled:false, threshold:120};
  if(!Array.isArray(state.adjust) || state.adjust.length !== state.players.length)
    state.adjust = state.players.map(()=>0);
  if(typeof state.hundredUsed !== "boolean") state.hundredUsed = false;
  if(typeof state.bonusApplied !== "boolean") state.bonusApplied = false;
  if(typeof state.sound !== "boolean") state.sound = true;
  if(typeof state.theme !== "string") state.theme = "light";
  // 对局数据迁移：旧格式为纯增量数组（number[]），新格式为 {pts:[], adj:[]}
  if(!Array.isArray(state.rounds)) state.rounds = [];
  else state.rounds = state.rounds.map(r=>{
    if(r && Array.isArray(r.pts) && Array.isArray(r.adj)) return Object.assign({kind:"normal", events:[]}, r);
    if(Array.isArray(r)) return {pts:r.slice(), adj:r.map(()=>0), kind:"normal", events:[]};
    return {pts:state.players.map(()=>0), adj:state.players.map(()=>0), kind:"normal", events:[]};
  });
}
normalize();

function roundSum(i){ return state.rounds.reduce((s,r)=> s + ((r.pts && r.pts[i])||0) + ((r.adj && r.adj[i])||0), 0); }
function totals(){ return state.players.map((_,i)=> roundSum(i) + (state.adjust[i]||0)); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function syncCount(n){
  while(state.players.length < n) state.players.push({name:"玩家"+(state.players.length+1)});
  while(state.players.length > n) state.players.pop();
  if(!Array.isArray(state.adjust) || state.adjust.length !== state.players.length)
    state.adjust = state.players.map(()=>0);
}
function toast(msg){
  let t = document.querySelector("#toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=> t.classList.remove("show"), 1400);
}
/* 应用内确认弹窗（替代原生 confirm，避免手机/PWA 下被拦截导致“点不动”） */
function askConfirm(title, msg, onYes){
  overlay.innerHTML = `
    <div class="modal">
      <h2>${escapeHtml(title)}</h2>
      <p style="color:var(--muted);font-size:14px;margin:0 0 16px">${escapeHtml(msg)}</p>
      <div class="modal-actions">
        <button class="ghost" id="cfNo">取消</button>
        <button class="primary" id="cfYes">确定</button>
      </div>
    </div>`;
  overlay.classList.remove("hidden");
  document.querySelector("#cfNo").onclick = ()=> overlay.classList.add("hidden");
  document.querySelector("#cfYes").onclick = ()=>{ overlay.classList.add("hidden"); onYes(); };
}

/* ---------- effects ---------- */
function launchConfetti(ms){
  ms = ms || 3200;
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80";
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  const resize = ()=>{ c.width = innerWidth; c.height = innerHeight; };
  resize(); addEventListener("resize", resize);
  const colors = ["#2e7d52","#ffd54f","#ef5350","#42a5f5","#ab47bc","#ffa726","#26c6da"];
  const N = 150, ps = [];
  for(let i=0;i<N;i++) ps.push({
    x:Math.random()*c.width, y:Math.random()*-c.height - 20,
    r:5+Math.random()*7, col:colors[i%colors.length],
    vy:2.4+Math.random()*3.4, vx:-1.4+Math.random()*2.8,
    a:Math.random()*Math.PI, va:0.08+Math.random()*0.22
  });
  const t0 = performance.now();
  function frame(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of ps){
      p.y += p.vy; p.x += p.vx; p.a += p.va;
      if(p.y > c.height+12){ p.y = -12; p.x = Math.random()*c.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6); ctx.restore();
    }
    if(t - t0 < ms) requestAnimationFrame(frame);
    else { c.remove(); removeEventListener("resize", resize); }
  }
  requestAnimationFrame(frame);
}
function showEventBanner(e){
  const b = document.createElement("div");
  b.className = "event-banner" + (e.type==="kamikaze" ? " kamikaze" : "");
  let html = "";
  if(e.type === "hundred")
    html = `<div class="eb-emoji">💯</div><div class="eb-title">百分减半！</div><div class="eb-sub">${escapeHtml(e.name)} 刚好 100 分 → 直接减半到 50！</div>`;
  else if(e.type === "kamikaze")
    html = `<div class="eb-emoji">🚀</div><div class="eb-title">神风特工队！</div><div class="eb-sub">${escapeHtml(e.name)} 本局 0 分，其余全员本局 50 分！</div>`;
  b.innerHTML = html;
  document.body.appendChild(b);
  if(e.type === "hundred") playDing();
  else if(e.type === "kamikaze") playWhoosh();
  requestAnimationFrame(()=> b.classList.add("show"));
  setTimeout(()=>{ b.classList.remove("show"); setTimeout(()=> b.remove(), 450); }, 2500);
}

/* ---------- local sound effects (Web Audio, no files, no network) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, t0, dur, type, peak){
  const ctx = audioCtx; const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak || 0.25, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function playDing(){               /* 百分减半：清脆「叮」 */
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  tone(988, t, 0.5, "sine", 0.32);      // B5
  tone(1318.5, t, 0.65, "sine", 0.18); // E6 泛音
}
function playWhoosh(){             /* 神风特工队：呼啸「咻」 */
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime, dur = 0.65;
  const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = Math.random()*2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const filt = ctx.createBiquadFilter(); filt.type = "bandpass"; filt.Q.value = 0.7;
  filt.frequency.setValueAtTime(300, t);
  filt.frequency.exponentialRampToValueAtTime(2400, t + dur*0.5);
  filt.frequency.exponentialRampToValueAtTime(380, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.38, t + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt); filt.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t + dur);
}
function playCheer(){              /* 获胜：上行欢呼琶音 + 小亮片 */
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((f,i)=> tone(f, t + i*0.12, 0.42, "triangle", 0.22));
  tone(1568, t + 0.5, 0.55, "sine", 0.12);
}

/* special-rule detection (mid-game events) */
function checkEvents(){
  const events = [];
  if(state.rules.hundredHalf.enabled && !state.hundredUsed){
    const ts = totals();
    state.players.forEach((p,i)=>{
      if(ts[i] === 100){
        state.adjust[i] = (state.adjust[i]||0) - 50;
        state.hundredUsed = true;            // 整场仅一次
        events.push({type:"hundred", name:p.name});
      }
    });
  }
  return events;
}

/* ---------- named saves (multiple finished/in-progress games) ---------- */
const SAVE_KEY = "cabo-saves-v1";
function deep(o){ return JSON.parse(JSON.stringify(o)); }
function fmtTime(ts){
  const d = new Date(ts), p = n => (n<10?"0":"")+n;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function loadSaves(){
  try{ const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; }
}
function saveSaves(list){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(list)); }catch(e){} }

    });

function openSavesList(){
  const list = loadSaves();
  let body;
  if(list.length===0) body = '<div style="color:var(--muted);font-size:14px">还没有保存的对局。</div>';
  else body = list.map(s=>{

      const t = s.rounds.reduce((a,r)=> a + ((r.pts&&r.pts[i])||0) + ((r.adj&&r.adj[i])||0), 0) + (s.adjust[i]||0);
      return `${escapeHtml(p.name)} ${t}`;
    }).join(" · ");
    return `<div class="save-item">

      <div class="save-sub">${s.players.length} 人 · ${s.rounds.length} 局 · ${scores}</div>
      <div class="save-actions">
        <button class="mini" data-load="${s.id}">载入继续</button>
        <button class="mini danger" data-del="${s.id}">删除</button>
      </div>
    </div>`;
  }).join("");
  overlay.innerHTML = `
    <div class="modal">

  overlay.classList.remove("hidden");

  overlay.querySelectorAll("[data-load]").forEach(b=> b.onclick=()=>{ overlay.classList.add("hidden"); loadSave(+b.dataset.load); });

      saveSaves(loadSaves().filter(s=> s.id !== +b.dataset.del));
      openSavesList();
    });
  });
}
function loadSave(id){
  const s = loadSaves().find(x=> x.id===id);
  if(!s) return;
  state.players = s.players.map(p=>({name:p.name}));
  state.rounds = deep(s.rounds);
  state.adjust = s.adjust.slice();
  state.hundredUsed = !!s.hundredUsed;
  state.bonusApplied = !!s.bonusApplied;
  state.endScore = s.endScore;
  state.winRule = s.winRule;
  state.rules = deep(s.rules);
  state.started = true;
  save(); render();
  toast("已载入：" + s.name);

function historyHtml(){

      : `<span class="rn">第 ${k+1} 局</span>`;
    const parts = state.players.map((p,i)=>{
      const pts = (r.pts && r.pts[i])||0;
      const adj = (r.adj && r.adj[i])||0;
      let s = `<span class="pname">${escapeHtml(p.name)}</span><span class="d">${pts>=0?'+':''}${pts}</span>`;
      if(adj) s += `<span class="adj" title="附加分（惩罚）">⚡+${adj}</span>`;
      return s;
    }).join(" ");
    html += `<div class="r ${isK?'r-kamikaze':''}">${rnHtml}<span class="parts">${parts}</span></div>`;
    // 本局之后的事件行（夹在局与局之间）
    if(isK)
      html += `<div class="r-event ev-kamikaze"><span class="ev-emoji">🚀</span><span>${escapeHtml(r.actor||"某人")} 本局 0 分，其余全员本局各 50 分</span></div>`;

        html += `<div class="r-event ev-hundred"><span class="ev-emoji">💯</span><span><b>百分减半！</b>${escapeHtml(e.name)} 刚好 100 分 → 直接减半到 50</span></div>`;

function submitRound(){
  const pts = state.players.map((_,i)=> parseFloat(document.getElementById("pts-"+i).value)||0);
  const adj = roundAdj.slice();
  if(pts.every(p=> p===0) && adj.every(a=> a===0)){ toast("本局全是 0，确认要提交？"); }
  state.rounds.push({pts, adj, kind:"normal", events:[]});
  const events = checkEvents();
  state.rounds[state.rounds.length-1].events = events;
  save();
  events.forEach((e,idx)=> setTimeout(()=> showEventBanner(e), idx*2700));
  render();
}
function undo(){
  if(state.rounds.length===0) return;
  state.rounds.pop();
  // 百分减半：整场仅一次，已用过则不再触发；未用过且当前正好 100 才触发
  if(!state.hundredUsed && state.rules.hundredHalf.enabled){
    let ts = totals();
    state.players.forEach((p,i)=>{ if(ts[i]===100){ state.adjust[i]=(state.adjust[i]||0)-50; state.hundredUsed=true; ts=totals(); } });
  }
  save(); render(); toast("已撤销上一局");
}
function checkEnd(ts){
  const reached = ts.findIndex(t=> t >= state.endScore);
  if(reached >= 0) showGameOver(ts, reached);
}
function showGameOver(ts, reachedIdx){
  let winIdx = 0;
  if(state.winRule==="low"){ let m=Infinity; ts.forEach((t,i)=>{ if(t<m){m=t;winIdx=i;} }); }
  else { let m=-Infinity; ts.forEach((t,i)=>{ if(t>m){m=t;winIdx=i;} }); }
  let bonusTxt = "";
  if(state.rules.lowBonus.enabled && !state.bonusApplied){
    const amt = state.rules.lowBonus.amount || 0;
    if(amt > 0){
      state.adjust[winIdx] = (state.adjust[winIdx]||0) - amt;
      state.bonusApplied = true;
      ts = totals();
      bonusTxt = `（险胜嘉奖 -${amt}）`;
      if(state.winRule==="low"){ let m=Infinity; ts.forEach((t,i)=>{ if(t<m){m=t;winIdx=i;} }); }
      else { let m=-Infinity; ts.forEach((t,i)=>{ if(t>m){m=t;winIdx=i;} }); }
    }
  }
  const list = state.players.map((p,i)=> `<div class="li ${i===winIdx?'win':''}"><span>${escapeHtml(p.name)}</span><span>${ts[i]} 分</span></div>`).join("");
  overlay.innerHTML = `
    <div class="modal">
      <div class="go-win"><div class="trophy">🏆</div>
        <div class="who">🎉 恭喜 ${escapeHtml(state.players[winIdx].name)} 获胜！</div>
        <div style="color:var(--muted);font-size:14px">${escapeHtml(state.players[reachedIdx].name)} 达到结束线 ${state.endScore} 分 ${bonusTxt}</div>
      </div>
      <div class="go-list">${list}</div>
      <div class="modal-actions">
        <button class="primary" id="newBtn">开始新对局</button>
        <button class="ghost" id="closeBtn">查看详情</button>
      </div>
    </div>`;
  overlay.classList.remove("hidden");
  launchConfetti(3400);
  playCheer();
  document.querySelector("#newBtn").onclick = ()=>{ state.rounds=[]; state.adjust=state.players.map(()=>0); state.hundredUsed=false; state.bonusApplied=false; save(); overlay.classList.add("hidden"); render(); };
  document.querySelector("#closeBtn").onclick = ()=> overlay.classList.add("hidden");
}

        </div>
        <div class="rule-row">
          <div class="desc">音效：减半「叮」· 神风「咻」· 获胜欢呼</div>
          <button class="toggle ${state.sound?'on':''}" data-snd="1">${state.sound?'开':'关'}</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="primary" id="saveSet">保存</button>
        <button class="danger" id="resetAll">重置全部</button>
      </div>
    </div>`;
  overlay.classList.remove("hidden");
  document.querySelector("#setNames").innerHTML = state.players.map((p,i)=> `<div class="name-row"><div class="pidx">${i+1}</div><input type="text" id="sname-${i}" value="${escapeHtml(p.name)}" maxlength="10"></div>`).join("");
  document.querySelectorAll("#setRule button").forEach(b=> b.onclick=()=>{ state.winRule=b.dataset.r; openSettings(); });
  document.querySelectorAll(".toggle").forEach(b=> b.onclick=()=>{ state.rules[b.dataset.r].enabled = !state.rules[b.dataset.r].enabled; openSettings(); });
  const snd = document.querySelector('[data-snd="1"]');
  if(snd) snd.onclick = ()=>{ state.sound = !state.sound; save(); openSettings(); };
  const sb = document.querySelector("#setBonus"); if(sb) sb.oninput = e=> state.rules.lowBonus.amount = Math.max(0, parseInt(e.target.value,10)||0);
  document.querySelector("#saveSet").onclick = ()=>{
    state.players.forEach((p,i)=>{ const el=document.getElementById("sname-"+i); if(el) p.name = el.value.trim()||("玩家"+(i+1)); });
    const es = parseInt(document.querySelector("#setEnd").value,10); if(es>0) state.endScore = es;
    save(); overlay.classList.add("hidden"); render();
  };
  document.querySelector("#resetAll").onclick = ()=>{
    askConfirm("重置全部", "确定要重置全部对局吗？所有分数将清空。", ()=>{ state = defaultState(); save(); overlay.classList.add("hidden"); render(); });
  };
}

renderHeader();
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
