/* ===== 内嵌二维码生成器（byte mode / EC-M / 版本1-10 自动选择，无外部依赖） ===== */
var CABOQR = (function(){
  var EXP = new Array(256), LOG = new Array(256);
  for(var i=0;i<8;i++) EXP[i] = 1<<i;
  for(var i=8;i<256;i++) EXP[i] = EXP[i-4]^EXP[i-5]^EXP[i-6]^EXP[i-8];
  for(var i=0;i<255;i++) LOG[EXP[i]] = i;
  function gexp(n){ while(n<0) n+=255; while(n>=256) n-=255; return EXP[n]; }
  function gmul(a,b){ return (a===0||b===0) ? 0 : gexp(LOG[a]+LOG[b]); }

  // EC 级别 M 的 RS 分块表：[块数, 块内总码字, 块内数据码字]
  var RS = {
    1:[[1,26,16]], 2:[[1,44,28]], 3:[[1,70,44]], 4:[[2,50,32]], 5:[[2,67,43]],
    6:[[4,43,27]], 7:[[4,49,31]], 8:[[2,60,38],[2,61,39]],
    9:[[3,58,36],[2,59,37]], 10:[[4,69,43],[1,70,44]]
  };
  var ALIGN = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
               7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};

  function dataCapacity(v){
    var n = 0; RS[v].forEach(function(b){ n += b[0]*b[2]; }); return n;
  }
  function rsGenPoly(ecLen){
    var poly = [1];
    for(var i=0;i<ecLen;i++){
      var next = new Array(poly.length+1);
      for(var k=0;k<next.length;k++) next[k]=0;
      for(var j=0;j<poly.length;j++){
        next[j]   ^= poly[j];
        next[j+1] ^= gmul(poly[j], gexp(i));
      }
      poly = next;
    }
    return poly;
  }
  function rsEncode(data, ecLen){
    var gen = rsGenPoly(ecLen);
    var res = data.slice();
    for(var i=0;i<ecLen;i++) res.push(0);
    for(var i=0;i<data.length;i++){
      var coef = res[i];
      if(coef !== 0){
        for(var j=0;j<gen.length;j++) res[i+j] ^= gmul(gen[j], coef);
      }
    }
    return res.slice(data.length);
  }
  function utf8Bytes(str){
    var out = [];
    for(var i=0;i<str.length;i++){
      var c = str.charCodeAt(i);
      if(c < 0x80) out.push(c);
      else if(c < 0x800){ out.push(0xc0|(c>>6), 0x80|(c&0x3f)); }
      else if(c >= 0xd800 && c <= 0xdbff && i+1 < str.length){
        var c2 = str.charCodeAt(i+1);
        var cp = 0x10000 + ((c-0xd800)<<10) + (c2-0xdc00); i++;
        out.push(0xf0|(cp>>18), 0x80|((cp>>12)&0x3f), 0x80|((cp>>6)&0x3f), 0x80|(cp&0x3f));
      }
      else { out.push(0xe0|(c>>12), 0x80|((c>>6)&0x3f), 0x80|(c&0x3f)); }
    }
    return out;
  }
  function pickVersion(byteLen){
    for(var v=1; v<=10; v++){
      var countBits = v < 10 ? 8 : 16;
      var need = 4 + countBits + byteLen*8;
      if(dataCapacity(v)*8 >= need) return v;
    }
    return null; // 超出支持范围
  }
  function buildCodewords(bytes, v){
    var bits = [];
    function push(val, len){ for(var i=len-1;i>=0;i--) bits.push((val>>i)&1); }
    push(4, 4);                              // byte mode
    push(bytes.length, v < 10 ? 8 : 16);     // 字符计数
    for(var i=0;i<bytes.length;i++) push(bytes[i], 8);
    var cap = dataCapacity(v)*8;
    for(var i=0;i<4 && bits.length<cap;i++) bits.push(0);   // 终止符
    while(bits.length % 8 !== 0) bits.push(0);
    var data = [];
    for(var i=0;i<bits.length;i+=8){
      var b = 0; for(var j=0;j<8;j++) b = (b<<1)|bits[i+j];
      data.push(b);
    }
    var pad = [0xEC, 0x11], pi = 0;
    while(data.length < dataCapacity(v)) data.push(pad[pi++ % 2]);
    // 分块 + RS 纠错
    var blocks = [], off = 0;
    RS[v].forEach(function(spec){
      for(var n=0;n<spec[0];n++){
        var d = data.slice(off, off+spec[2]); off += spec[2];
        blocks.push({ d:d, e:rsEncode(d, spec[1]-spec[2]) });
      }
    });
    var maxD = 0, maxE = 0;
    blocks.forEach(function(b){ maxD = Math.max(maxD,b.d.length); maxE = Math.max(maxE,b.e.length); });
    var out = [];
    for(var i=0;i<maxD;i++) blocks.forEach(function(b){ if(i<b.d.length) out.push(b.d[i]); });
    for(var i=0;i<maxE;i++) blocks.forEach(function(b){ if(i<b.e.length) out.push(b.e[i]); });
    return out;
  }
  function bchDigit(d){ var n=0; while(d!==0){ n++; d>>>=1; } return n; }
  var G15 = (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
  var G15_MASK = (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
  var G18 = (1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
  function bchTypeInfo(d){
    var x = d << 10;
    while(bchDigit(x) - bchDigit(G15) >= 0) x ^= (G15 << (bchDigit(x)-bchDigit(G15)));
    return ((d<<10)|x) ^ G15_MASK;
  }
  function bchTypeNumber(d){
    var x = d << 12;
    while(bchDigit(x) - bchDigit(G18) >= 0) x ^= (G18 << (bchDigit(x)-bchDigit(G18)));
    return (d<<12)|x;
  }
  function maskFn(p,i,j){
    switch(p){
      case 0: return (i+j)%2===0;
      case 1: return i%2===0;
      case 2: return j%3===0;
      case 3: return (i+j)%3===0;
      case 4: return (Math.floor(i/2)+Math.floor(j/3))%2===0;
      case 5: return (i*j)%2+(i*j)%3===0;
      case 6: return ((i*j)%2+(i*j)%3)%2===0;
      default: return ((i*j)%3+(i+j)%2)%2===0;
    }
  }
  function makeMatrix(v, mask, cw){
    var size = v*4+17;
    var m = [];
    for(var r=0;r<size;r++){ m.push(new Array(size)); for(var c=0;c<size;c++) m[r][c]=null; }
    function finder(row, col){
      for(var r=-1;r<=7;r++) for(var c=-1;c<=7;c++){
        if(row+r<0||size<=row+r||col+c<0||size<=col+c) continue;
        m[row+r][col+c] = (0<=r&&r<=6&&(c===0||c===6)) || (0<=c&&c<=6&&(r===0||r===6)) || (2<=r&&r<=4&&2<=c&&c<=4);
      }
    }
    finder(0,0); finder(size-7,0); finder(0,size-7);
    // 对齐图案
    var pos = ALIGN[v];
    for(var a=0;a<pos.length;a++) for(var b=0;b<pos.length;b++){
      var r0=pos[a], c0=pos[b];
      if(m[r0][c0] !== null) continue;
      for(var dr=-2;dr<=2;dr++) for(var dc=-2;dc<=2;dc++)
        m[r0+dr][c0+dc] = (Math.abs(dr)===2||Math.abs(dc)===2||(dr===0&&dc===0));
    }
    // 定位时序
    for(var i=8;i<size-8;i++){
      if(m[6][i]===null) m[6][i] = (i%2===0);
      if(m[i][6]===null) m[i][6] = (i%2===0);
    }
    // 版本信息（v>=7）
    if(v >= 7){
      var vb = bchTypeNumber(v);
      for(var i=0;i<18;i++){
        var mod = ((vb>>i)&1)===1;
        m[Math.floor(i/3)][i%3+size-8-3] = mod;
        m[i%3+size-8-3][Math.floor(i/3)] = mod;
      }
    }
    // 格式信息（EC-M => 0）
    var fb = bchTypeInfo((0<<3)|mask);
    for(var i=0;i<15;i++){
      var mod = ((fb>>i)&1)===1;
      if(i<6) m[i][8] = mod;
      else if(i<8) m[i+1][8] = mod;
      else m[size-15+i][8] = mod;
      if(i<8) m[8][size-i-1] = mod;
      else if(i<9) m[8][15-i-1+1] = mod;
      else m[8][15-i-1] = mod;
    }
    m[size-8][8] = true; // 固定黑点
    // 数据填充
    var inc = -1, row = size-1, bitIdx = 7, byteIdx = 0;
    for(var col = size-1; col > 0; col -= 2){
      if(col === 6) col--;
      for(;;){
        for(var c=0;c<2;c++){
          if(m[row][col-c] === null){
            var dark = false;
            if(byteIdx < cw.length) dark = ((cw[byteIdx] >>> bitIdx) & 1) === 1;
            if(maskFn(mask, row, col-c)) dark = !dark;
            m[row][col-c] = dark;
            bitIdx--;
            if(bitIdx === -1){ byteIdx++; bitIdx = 7; }
          }
        }
        row += inc;
        if(row < 0 || size <= row){ row -= inc; inc = -inc; break; }
      }
    }
    return m;
  }
  function lostPoint(m){
    var size = m.length, lost = 0, r, c;
    for(r=0;r<size;r++) for(c=0;c<size;c++){
      var same = 0, dark = m[r][c];
      for(var dr=-1;dr<=1;dr++){
        if(r+dr<0||size<=r+dr) continue;
        for(var dc=-1;dc<=1;dc++){
          if(c+dc<0||size<=c+dc) continue;
          if(dr===0&&dc===0) continue;
          if(dark === m[r+dr][c+dc]) same++;
        }
      }
      if(same > 5) lost += 3 + same - 5;
    }
    for(r=0;r<size-1;r++) for(c=0;c<size-1;c++){
      var cnt = 0;
      if(m[r][c]) cnt++; if(m[r+1][c]) cnt++; if(m[r][c+1]) cnt++; if(m[r+1][c+1]) cnt++;
      if(cnt===0||cnt===4) lost += 3;
    }
    for(r=0;r<size;r++) for(c=0;c<size-6;c++)
      if(m[r][c]&&!m[r][c+1]&&m[r][c+2]&&m[r][c+3]&&m[r][c+4]&&!m[r][c+5]&&m[r][c+6]) lost += 40;
    for(c=0;c<size;c++) for(r=0;r<size-6;r++)
      if(m[r][c]&&!m[r+1][c]&&m[r+2][c]&&m[r+3][c]&&m[r+4][c]&&!m[r+5][c]&&m[r+6][c]) lost += 40;
    var dc2 = 0;
    for(c=0;c<size;c++) for(r=0;r<size;r++) if(m[r][c]) dc2++;
    lost += (Math.abs(100*dc2/size/size - 50)/5)*10;
    return lost;
  }
  function make(text){
    var bytes = utf8Bytes(text);
    var v = pickVersion(bytes.length);
    if(!v) return null;                      // 内容过长
    var cw = buildCodewords(bytes, v);
    var best = null, bestScore = Infinity;
    for(var mask=0; mask<8; mask++){
      var m = makeMatrix(v, mask, cw);
      var s = lostPoint(m);
      if(s < bestScore){ bestScore = s; best = m; }
    }
    return best;
  }
  function svg(text, px, quiet){
    var m = make(text);
    if(!m) return null;
    quiet = (quiet==null) ? 4 : quiet;
    var size = m.length, total = size + quiet*2, path = "";
    for(var r=0;r<size;r++) for(var c=0;c<size;c++)
      if(m[r][c]) path += "M"+(c+quiet)+" "+(r+quiet)+"h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" width="'+px+'" height="'+px+t('" shape-rendering="crispEdges" role="img" aria-label="二维码">')
         + '<rect width="'+total+'" height="'+total+'" fill="#ffffff"/><path d="'+path+'" fill="#000000"/></svg>';
  }
  return { make: make, svg: svg };
})();

/* ===== 账号与云端同步：注册/登录后计分状态存服务器，换设备可续；语音走后端 TTS 让任何设备出声 ===== */
function API_BASE(){
  try{
    const explicit = localStorage.getItem('cabo-api');
    if(explicit) return explicit;            // 例：https://abc.service.tcloudbase.com（不含 /api）
  }catch(e){}
  try{
    const h = location.hostname;
    // CloudBase 静态托管域名 *.tcloudbaseapp.com 下，/api 挂在 HTTP 服务域名 *.service.tcloudbase.com
    if(h.endsWith('.tcloudbaseapp.com')){
      const sub = h.split('.')[0];
      const env = sub.replace(/-(\d+)$/, '');   // 去掉静态托管域名随机后缀，得到真实 envId
      return 'https://' + env + '.service.tcloudbase.com';
    }
  }catch(e){}
  return '';                                 // 同源相对路径（自托管 Node 后端 / 本地）
}

}

<script>

  function whoAmI(){

  // ---------- 玩家配色头像（复用 state.players[i].color，缺则补） ----------
  var AV_COLORS = ['#4f8cff','#36d399','#f472b6','#fbbf24','#a78bfa','#22d3ee','#fb7185','#84cc16'];
  function ensurePlayerColor(i){

  // ---------- 分数变更：高亮 + 复盘流水 ----------

  function saveReplay(){ try { localStorage.setItem('cabo-replay', JSON.stringify(REPLAY.slice(-200))); } catch(e){} }
  var prevTotals = {};
  function totalOf(i){
    try {
      var t = 0; (state.rounds || []).forEach(function(r){ t += (r.pts && r.pts[i] != null) ? r.pts[i] : 0; });
      t += (state.adjust && state.adjust[i]) || 0; return t;

  }
  function logChange(i, delta, total){
    if (!delta) return;

  // ---------- 房间密码（复用原生 MQTT/Gist 同步：密码存 state.roomPwd） ----------
  function hashPwd(p){ try { var h = 0; p = '' + p; for (var i = 0; i < p.length; i++) h = (h * 31 + p.charCodeAt(i)) >>> 0; return 'h' + h.toString(36); } catch(e){ return ''; } }

  // ---------- 战绩分享海报（canvas 导出，尊重胜负规则） ----------
  function roundRect(c, x, y, w, h, r){
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function getTotals(){

  }
  function gameLabel(){

  function buildPoster(){

      c.fillText(medal, pad + 90, ay + 26);
      c.textAlign = 'right'; c.fillStyle = isW ? '#ffe066' : '#fff'; c.font = 'bold 40px sans-serif';
      c.fillText('' + ts[idx], W - pad - 24, ay);
    });

    c.fillText('Generated by 桌游记分 · Scorer', W / 2, H - 50);
    // 弹窗展示 + 下载

  function injectPosterBtn(){

  // ---------- P0 拍照 OCR 分数识别（tesseract.js 纯前端 / 图片不上云） ----------
  var OCR_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  function loadTesseractScript(){
    return new Promise(function(res, rej){
      if (window.Tesseract) return res(window.Tesseract);

      s.onload = function(){ window.Tesseract ? res(window.Tesseract) : rej(new Error('Tesseract 未就绪')); };
      s.onerror = function(){ rej(new Error(tr('识别引擎加载失败（网络/外链被拦截）', 'Engine load failed (network)'))); };

  }
  function getOcrWorker(){
    if (window.__fpOcrWorker) return Promise.resolve(window.__fpOcrWorker);
    return loadTesseractScript().then(function(T){
      var setProg = function(p, txt){ var bar = $('#ocrBar'); if (bar) bar.style.width = Math.max(2, Math.round((p || 0) * 100)) + '%'; var t = $('#ocrProgTxt'); if (t && txt) t.textContent = txt; };
      return T.createWorker('eng', 1, { logger: function(m){ if (m && m.status) setProg(m.progress, m.status + (m.progress ? (' ' + Math.round(m.progress * 100) + '%') : '')); } }).then(function(w){ window.__fpOcrWorker = w; return w; });
    });
  }
  function openOcr(){
    if (!state.players || !state.players.length){ toast(tr('请先添加玩家', 'Add players first')); return; }
    var html = '<div class="modal ocr-modal">'
      + '<h2>📷 ' + tr('拍照识别录入分数', 'Photo OCR entry') + '</h2>'
      + '<p class="ocr-tip">' + tr('图片仅在本地识别，不上传云端。首次需下载识别引擎（约几 MB）。', 'Images recognized locally, never uploaded. First run downloads engine.') + '</p>'
      + '<div class="ocr-file-row">'
      + '<label class="ocr-file-btn">' + tr('📸 拍照', '📸 Camera') + '<input type="file" id="ocrFile" accept="image/*" capture="environment" style="display:none"></label>'
      + '<label class="ocr-file-btn">' + tr('🖼 从相册选择', '🖼 From album') + '<input type="file" id="ocrFileGal" accept="image/*" style="display:none"></label>'
      + '</div>'
      + '<div id="ocrProg" class="ocr-prog hidden"><div class="ocr-bar"><i id="ocrBar"></i></div><span class="ocr-prog-txt" id="ocrProgTxt"></span></div>'
      + '<div id="ocrRes" class="ocr-res hidden">'
      + '<p class="ocr-res-tip">' + tr('识别到', 'Recognized') + ' <b id="ocrCount">0</b> ' + tr('个数字，可修改并选玩家：', 'digits, edit & pick player:') + '</p>'
      + '<div id="ocrList" class="ocr-list"></div>'
      + '<div class="modal-actions"><button class="ghost" id="ocrCancel">' + tr('取消', 'Cancel') + '</button><button class="primary" id="ocrApply">' + tr('应用到本局', 'Apply to round') + '</button></div>'
      + '</div>'
      + '<details class="ocr-paste"><summary>' + tr('没有相机？粘贴数字', 'No camera? Paste numbers') + '</summary>'
      + '<textarea id="ocrPaste" placeholder="3, 7, 11, 2, 9"></textarea>'
      + '<button class="ghost" id="ocrPasteApply">' + tr('用粘贴的数字', 'Use pasted') + '</button></details>'
      + '</div>';
    showModal(html);
    var f = $('#ocrFile'); if (f) f.onchange = onOcrFile;
    var fg = $('#ocrFileGal'); if (fg) fg.onchange = onOcrFile;
    var c = $('#ocrCancel'); if (c) c.onclick = closeModal;
    var a = $('#ocrApply'); if (a) a.onclick = applyOcrResult;
    var pa = $('#ocrPasteApply'); if (pa) pa.onclick = function(){
      var t = $('#ocrPaste'); var arr = (typeof window.parsePastedScores === 'function') ? window.parsePastedScores(t ? t.value : '', state.players.length) : null;
      if (!arr){ toast(tr('无法解析，请检查格式', 'Cannot parse')); return; }
      applyOcrToGame(arr); closeModal(); toast(tr('已填入当前回合，请核对后提交', 'Filled — review then submit'));
    };
  }
  function onOcrFile(e){
    var file = e.target.files && e.target.files[0]; if (!file) return;
    if (e.target) e.target.value = '';
    var prog = $('#ocrProg'); if (prog) prog.classList.remove('hidden');
    var setTxt = function(t){ var x = $('#ocrProgTxt'); if (x) x.textContent = t; };
    setTxt(tr('加载识别引擎…', 'Loading engine…'));
    getOcrWorker().then(function(worker){
      setTxt(tr('识别中…', 'Recognizing…'));
      return worker.recognize(file);
    }).then(function(out){
      var txt = (out && out.data && out.data.text) || '';
      var nums = (txt.match(/-?\d+/g) || []).map(function(s){ return parseInt(s, 10); }).filter(function(n){ return !isNaN(n) && n >= 0 && n <= 999; });
      renderOcrList(nums);
    }).catch(function(err){
      setTxt(''); if (prog) prog.classList.add('hidden');
      toast(tr('识别失败：', 'OCR failed: ') + (err && err.message ? err.message : err));
    });
  }
  function renderOcrList(nums){
    var list = $('#ocrList'); if (!list) return;
    var res = $('#ocrRes'); if (res) res.classList.remove('hidden');
    var prog = $('#ocrProg'); if (prog) prog.classList.add('hidden');
    var cnt = $('#ocrCount'); if (cnt) cnt.textContent = nums.length;
    var n = state.players.length;
    list.innerHTML = nums.map(function(v, i){
      var sel = (i < n) ? i : (i % n);
      var opts = state.players.map(function(p, j){ return '<option value="' + j + '"' + (j === sel ? ' selected' : '') + '>' + escapeHtml(p.name || ('P' + (j + 1))) + '</option>'; }).join('');
      return '<div class="ocr-row"><input type="number" id="ocrv-' + i + '" value="' + v + '" inputmode="numeric" class="ocr-num"><span>→</span><select id="ocru-' + i + '">' + opts + '</select></div>';
    }).join('') || '<p style="color:var(--muted)">' + tr('未识别到数字', 'No digits found') + '</p>';
  }
  function applyOcrResult(){
    var n = state.players.length, arr = []; for (var i = 0; i < n; i++) arr.push(0);
    $all('.ocr-row').forEach(function(row){
      var input = row.querySelector('input'); var sel = row.querySelector('select');
      if (!input || !sel) return;
      var vi = parseInt(sel.value, 10), v = parseInt(input.value, 10) || 0;
      if (vi >= 0 && vi < n) arr[vi] = v;
    });
    applyOcrToGame(arr); closeModal(); toast(tr('已填入当前回合，请核对后提交', 'Filled — review then submit'));
  }
  function applyOcrToGame(arr){
    if (!arr || !arr.length) return;
    state.players.forEach(function(_, i){
      if (i >= arr.length) return;
      var v = arr[i], el;
      if (state.rules.cardInput === 'cards'){ el = document.querySelector('#c' + i + '-0'); if (el){ el.value = v; if (typeof recomputeCaboSum === 'function') recomputeCaboSum(i); } }
      else if (state.game === 'skyjo'){ for (var k = 0; k < 12; k++){ var e = document.querySelector('#sky' + i + '-' + k); if (e) e.value = (k === 0 ? v : ''); } if (typeof recomputeSkySum === 'function') recomputeSkySum(i); }
      else { el = document.querySelector('#pts-' + i); if (el){ el.value = v; if (typeof recomputeCaboSum === 'function') recomputeCaboSum(i); } }
    });
  }
  function injectOcrBtn(){
    var panel = $('#qiPanel'); if (!panel || $('#ocrBtn')) return;
    var btn = document.createElement('button'); btn.id = 'ocrBtn'; btn.className = 'ghost';
    btn.textContent = '📷 ' + tr('拍照识别', 'Photo OCR');
    btn.onclick = openOcr;
    var paste = panel.querySelector('#qiPaste');
    if (paste && paste.parentNode){ paste.parentNode.insertBefore(btn, paste.nextSibling); }
    else panel.insertBefore(btn, panel.firstChild);
  }

  // ---------- 样式 ----------
  function injectCss(){
    var css = ''
      + '.pc-avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;margin-right:8px;flex:0 0 auto}'
      + '.player-card.fp-up .pc-total{animation:fpFlashUp 1.6s ease}'
      + '.player-card.fp-down .pc-total{animation:fpFlashDown 1.6s ease}'
      + '@keyframes fpFlashUp{0%{color:#36d399;transform:scale(1.25);text-shadow:0 0 10px rgba(54,211,153,.8)}100%{color:inherit;transform:scale(1)}}'
      + '@keyframes fpFlashDown{0%{color:#f87171;transform:scale(1.25);text-shadow:0 0 10px rgba(248,113,113,.8)}100%{color:inherit;transform:scale(1)}}'
      + '.fp-replay{width:100%;border-collapse:collapse;font-size:13px} .fp-replay th,.fp-replay td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left} .fp-plus{color:#36d399;font-weight:700} .fp-minus{color:#f87171;font-weight:700}'
      + '.fp-toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:10px;z-index:9999;font-size:14px}'
      + 'body.casting .actions,body.casting #moreSheet,body.casting .special-panel,body.casting .qi-panel,body.casting .history{display:none!important}'
      + 'body.casting #players{gap:18px;padding:24px} body.casting .player-card{transform:scale(1.12);transform-origin:top left;margin-bottom:10px}'
      + 'body.casting .pc-total{font-size:34px!important} body.casting .pc-name{font-size:22px}'
      + '#castExitBtn{position:fixed;right:16px;bottom:16px;z-index:9998;display:none;background:rgba(17,17,17,.82);color:#fff;border:1px solid rgba(255,255,255,.4);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer}'
      + 'body.casting #castExitBtn{display:flex!important}'
      + '.ocr-modal .ocr-tip{color:var(--muted);font-size:12px;margin:4px 0 12px}'
      + '.ocr-file-btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#4f8cff;color:#fff;font-weight:600;cursor:pointer;margin-bottom:10px}'
      + '.ocr-file-row{display:flex;gap:10px;margin-bottom:10px} .ocr-file-row .ocr-file-btn{flex:1;text-align:center;margin-bottom:0}'
      + '.ocr-prog{margin:10px 0} .ocr-bar{height:8px;background:rgba(127,127,127,.25);border-radius:6px;overflow:hidden} .ocr-bar i{display:block;height:100%;width:2%;background:#4f8cff;transition:width .2s} .ocr-prog-txt{display:block;font-size:12px;color:var(--muted);margin-top:4px}'
      + '.ocr-res{margin-top:8px} .ocr-list{max-height:42vh;overflow:auto} .ocr-row{display:flex;align-items:center;gap:8px;margin:6px 0} .ocr-row .ocr-num{width:84px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg,#fff);color:var(--text,#222);font-size:15px} .ocr-row select{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg,#fff);color:var(--text,#222)}'
      + '.ocr-paste{margin-top:12px;font-size:13px;color:var(--muted)} .ocr-paste textarea{width:100%;min-height:60px;margin:6px 0;border-radius:8px;border:1px solid var(--line);padding:8px}';
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  }

  // ---------- 初始化：包裹 render，每次渲染后挂载 ----------
  function afterRender(){
    injectAvatars();
    injectCastBtn();
    injectReplayBtn();
    injectPosterBtn();
    injectRoomPwd();
    injectOcrBtn();
    prevTotals = {}; rescan();
  }
  function init(){
    injectCss();
    injectCastExit();
    bindCastKeys();
    startObs();
    if (typeof window.render === 'function') {
      var _render = window.render;
      window.render = function(){ var r = _render.apply(this, arguments); afterRender(); return r; };
    }
    afterRender();
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') init();
  else document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
