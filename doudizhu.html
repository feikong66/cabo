<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扑克计分 · 斗地主/跑得快/干瞪眼/510K/掼蛋</title>
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2536; --line:#2a3550;
    --txt:#e8edf7; --sub:#9fb0cc; --brand:#4f8cff; --brand2:#36d399;
    --warn:#ffb454; --danger:#ff7a90; --shadow:0 8px 28px rgba(0,0,0,.35); --muted:#6b7a99; --input-bg:#0f1626;
  }
  :root[data-theme="light"]{
    --bg:#eef2f8; --bg2:#e3e9f2; --card:#ffffff; --line:#d6deea;
    --txt:#16203a; --sub:#5a6b8c; --brand:#3a7bf0; --brand2:#1faf7a;
    --warn:#d98300; --danger:#e05a70; --shadow:0 8px 28px rgba(20,40,80,.12); --muted:#7a89a8; --input-bg:#f1f5fb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2740 0%,var(--bg) 60%);color:var(--txt);
    -webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)}
  .brand{font-size:18px;font-weight:700}.brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:1px}
  .back{margin-left:auto;color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 12px;border-radius:9px}
  .theme-btn{margin-left:8px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:15px;cursor:pointer}
  .tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:76px;background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:11px;padding:11px 6px;font-size:14px;cursor:pointer}
  .tabs button.active{background:linear-gradient(135deg,var(--brand),#3a7bf0);color:#fff;border-color:transparent;font-weight:700}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  .panel h2{margin:0 0 14px;font-size:15px;color:var(--sub);font-weight:600;letter-spacing:.5px}
  .field{margin-bottom:14px}
  .field>label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  input,select{width:100%;background:var(--input-bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px;outline:none}
  input:focus{border-color:var(--brand)}
  /* 玩家卡 */
  .pcard{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
  .pcard .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .pcard .nm{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .nm .tag{font-size:11px;color:var(--warn);margin-left:6px}
  .pcard .sc{font-size:20px;font-weight:800}
  .pcard .sc.neg{color:var(--danger)}
  .pcard .sc.pos{color:var(--brand2)}
  .pcard .edit{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px}
  .rank-badge{display:inline-block;font-size:11px;color:#fff;background:var(--brand);border-radius:8px;padding:1px 7px;margin-right:6px}
  .rank-badge.gold{background:#f0b429}
  /* 结算面板通用 */
  .ddz-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .ddz-lab{font-weight:700;color:var(--sub);min-width:64px;font-size:13px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;background:var(--input-bg);border:1px solid var(--line);color:var(--sub);border-radius:9px;padding:9px 10px;font-size:13px;cursor:pointer}
  .seg button.active{background:linear-gradient(135deg,var(--brand),#3a7bf0);color:#fff;border-color:transparent}
  .pick{display:flex;gap:6px;flex-wrap:wrap}
  .pick button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);cursor:pointer;font-size:13px}
  .pick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .stepper button{width:34px;height:34px;border:none;background:var(--bg2);color:var(--txt);font-size:17px;cursor:pointer}
  .stepper input{width:52px;height:34px;border:none;text-align:center;background:var(--input-bg);color:var(--txt);font-size:15px}
  .checks{display:flex;gap:16px;flex-wrap:wrap}
  .checks .ck{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--txt)}
  .checks input{width:auto}
  .remain-item{display:flex;align-items:center;gap:5px;font-size:13px}
  .remain-item input{width:52px;height:32px;text-align:center;padding:4px}
  .winner-tag{font-weight:700;color:var(--brand2)}
  .summary{margin-top:4px;padding:12px;border-radius:10px;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.6;border:1px dashed var(--line)}
  .summary b{color:var(--warn)}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;margin-top:6px}
  .btn-primary{background:linear-gradient(135deg,var(--brand),#3a7bf0);color:#fff;box-shadow:0 6px 18px rgba(79,140,255,.35)}
  .btn-ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .btn-warn{background:#2a2030;color:#ff9aa6;border:1px solid #5a2a3a}
  .hist{margin-top:8px}
  .hist .h{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line);color:var(--sub)}
  .hist .h small{display:block;color:var(--muted);margin-top:2px}
  .toggle-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin-top:14px}
  .switch{position:relative;width:46px;height:26px;background:var(--input-bg);border:1px solid var(--line);border-radius:20px;cursor:pointer;flex:none}
  .switch.on{background:var(--brand2);border-color:var(--brand2)}
  .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on i{left:22px}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000a;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .tip{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .count-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .count-row label{font-size:13px;color:var(--sub)}
  /* 规则弹窗 */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
  .modal{width:min(920px,100%);max-height:min(760px,92vh);background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .modal-head h3{margin:0;font-size:16px;color:var(--txt)}
  .modal-close{background:var(--bg);border:1px solid var(--line);color:var(--sub);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
  .modal-body{display:flex;flex:1;overflow:hidden}
  .rule-sidebar{width:150px;border-right:1px solid var(--line);overflow:auto;padding:10px 0;background:var(--bg2)}
  .rule-sidebar button{display:block;width:100%;text-align:left;padding:11px 16px;border:none;background:transparent;color:var(--sub);font-size:14px;cursor:pointer;border-left:3px solid transparent}
  .rule-sidebar button.active{background:var(--card);color:var(--brand);border-left-color:var(--brand);font-weight:700}
  .rule-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .rule-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2)}
  .rule-tabs button{flex:1;padding:12px;border:none;background:transparent;color:var(--sub);font-size:14px;cursor:pointer;position:relative}
  .rule-tabs button.active{color:var(--brand);font-weight:700;background:var(--card)}
  .rule-tabs button.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--brand)}
  .rule-panel{flex:1;overflow:auto;padding:18px 20px;font-size:14px;line-height:1.75;color:var(--txt)}
  .rule-panel h4{margin:0 0 10px;color:var(--brand);font-size:15px}
  .rule-panel h5{margin:16px 0 8px;color:var(--warn);font-size:14px}
  .rule-panel p{margin:6px 0;color:var(--txt)}
  .rule-panel .sub{color:var(--sub)}
  .rule-panel table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
  .rule-panel th,.rule-panel td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  .rule-panel th{background:var(--bg2);color:var(--sub);font-weight:600}
  .rule-panel .tag{display:inline-block;background:var(--bg2);border:1px solid var(--line);color:var(--brand);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:6px}
  .rule-panel .mult{color:var(--danger);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎴</div>
    <div class="brand">扑克计分<small>POKER SCORER</small></div>
    <button class="theme-btn" id="ruleBtn" title="游戏规则">📖</button>
    <button class="theme-btn" id="themeBtn" title="切换深色 / 浅色">🌙</button>
    <a class="back" href="index.html">← 首页</a>
  </header>

  <div class="tabs" id="modeTabs">
    <button data-mode="ddz">斗地主</button>
    <button data-mode="pdk">跑得快</button>
    <button data-mode="gdy">干瞪眼</button>
    <button data-mode="zjh">炸金花</button>
    <button data-mode="nn">牛牛</button>
    <button data-mode="texas">德州扑克</button>
    <button data-mode="bj">21点</button>
    <button data-mode="k510">510K</button>
    <button data-mode="gd">掼蛋</button>
  </div>

  <div class="panel" id="playersPanel">
    <h2>玩家</h2>
    <div class="count-row" id="countRow">
      <label>人数</label>
      <div class="stepper"><button id="countMinus">−</button><input id="countVal" type="number" min="2" max="6"><button id="countPlus">+</button></div>
      <span class="tip" id="countTip"></span>
    </div>
    <div id="playerCards"></div>
  </div>

  <div class="panel" id="settlePanel">
    <h2 id="settleTitle">本局结算</h2>
    <div id="settleBody"></div>
    <button class="btn btn-primary" id="commitBtn">结算本局</button>
  </div>

  <div class="panel">
    <h2>总分排行（高分胜）</h2>
    <div id="board"></div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn btn-ghost" id="undoBtn">↩ 撤销上一局</button>
      <button class="btn btn-warn" id="resetBtn">🧹 重置全部</button>
    </div>
    <div class="toggle-row">
      <div class="switch" id="voiceSw"><i></i></div>
      <span>语音播报（自动念总分）</span>
    </div>
    <h2 style="margin-top:20px">对局记录</h2>
    <div class="hist" id="histList"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="ruleModal">
  <div class="modal">
    <div class="modal-head">
      <h3>📖 游戏规则</h3>
      <button class="modal-close" id="ruleClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="rule-sidebar" id="ruleSidebar"></div>
      <div class="rule-content">
        <div class="rule-tabs" id="ruleTabs">
          <button class="active" data-tab="intro">图文说明</button>
          <button data-tab="rule">玩法规则</button>
        </div>
        <div class="rule-panel" id="rulePanel"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  /* ================= 模式与独立存档 key ================= */
  var MODES = {
    ddz: { label:'斗地主', key:'poker-ddz', min:3, max:3, defN:3, fixed:true  },
    pdk: { label:'跑得快', key:'poker-pdk', min:3, max:6, defN:3, fixed:false },
    gdy: { label:'干瞪眼', key:'poker-gdy', min:4, max:4, defN:4, fixed:true  },
    zjh: { label:'炸金花', key:'poker-zjh', min:2, max:6, defN:3, fixed:false },
    nn:  { label:'牛牛',   key:'poker-nn',  min:3, max:6, defN:4, fixed:false },
    texas:{ label:'德州扑克', key:'poker-texas', min:2, max:6, defN:4, fixed:false },
    bj:  { label:'21点',   key:'poker-bj',  min:2, max:6, defN:3, fixed:false },
    k510:{ label:'510K',   key:'poker-510k', min:3, max:3, defN:3, fixed:true },
    gd:  { label:'掼蛋',   key:'poker-gd',  min:4, max:4, defN:4, fixed:true  }
  };
  var DEF_NAMES = {
    ddz:['地主','农民1','农民2'],
    pdk:['玩家1','玩家2','玩家3'],
    gdy:['玩家1','玩家2','玩家3','玩家4'],
    zjh:['玩家1','玩家2','玩家3'],
    nn:['玩家1','玩家2','玩家3','玩家4'],
    texas:['玩家1','玩家2','玩家3','玩家4'],
    bj:['庄家','闲家1','闲家2'],
    k510:['玩家1','玩家2','玩家3'],
    gd:['玩家1','玩家2','玩家3','玩家4']
  };
  var COLORS = ['#ffb454','#4f8cff','#36d399','#a78bfa','#f472b6','#34d399'];
  /* 牛牛牛型表：strength 比大小，mult 倍率 */
  var NIU_DEFS = [
    {name:'无牛',  strength:0,  mult:1},
    {name:'牛一',  strength:1,  mult:1},
    {name:'牛二',  strength:2,  mult:1},
    {name:'牛三',  strength:3,  mult:1},
    {name:'牛四',  strength:4,  mult:1},
    {name:'牛五',  strength:5,  mult:1},
    {name:'牛六',  strength:6,  mult:1},
    {name:'牛七',  strength:7,  mult:2},
    {name:'牛八',  strength:8,  mult:2},
    {name:'牛九',  strength:9,  mult:2},
    {name:'牛牛',  strength:10, mult:3},
    {name:'五花牛',strength:11, mult:4},
    {name:'炸弹牛',strength:12, mult:5}
  ];

  /* ================= 规则百科数据 ================= */
  var RULES = {
    pdk:{
      title:'跑得快',
      intro:'<h4>基本牌型</h4><table><tr><th>牌型</th><th>说明</th></tr><tr><td>连对</td><td>2个及以上点数对子，从3到A</td></tr><tr><td>三张</td><td>最后一手牌时，3张相同点数可单出</td></tr><tr><td>三带一</td><td>最后一手牌时，3张相同可带1张</td></tr><tr><td>三带二</td><td>3张相同带任意2张其他牌（可对子或单张）</td></tr><tr><td>飞机</td><td>点数相连的三带（两组）</td></tr><tr><td>同花顺</td><td>5张相邻点数且花色相同，A只能在头或尾</td></tr><tr><td>炸弹</td><td>4张及以上相同点数</td></tr><tr><td>钢板</td><td>2组3张点数相邻的牌，只能2组不能带其他</td></tr></table><h5>特殊规则</h5><p><span class="tag">全关</span>一人出完手牌，其他任意一家一张未出。</p><p><span class="tag">炸弹现结</span>打出炸弹的玩家获得底分×20欢乐豆，其他各扣底分×10。</p><p><span class="tag">放走包赔</span>下家报单时，故意出非最大牌放走单张下家，需替另一个输家结算（炸弹不算）。</p>',
      rule:'<h4>基本规则</h4><p><span class="tag">牌张</span>去掉大小王、3张2、1张A，共48张牌，3人各16张。</p><p><span class="tag">胜负</span>一家打完手牌即获胜；<span class="tag">必出</span>有大过上家的牌一定要打出。</p><h4>结算</h4><p>输家输豆 = 剩牌数量 × 底分 × 倍数 × 罚分</p><p>赢家赢豆 = 其余两名玩家输豆之和</p><p>剩牌越多罚分越高：全关罚分<span class="mult">3</span>，剩8~15张罚分<span class="mult">2</span>。</p><p class="sub">2025/12/2规则更新：打出炸弹后会使倍数加倍。</p>'
    },
    gdy:{
      title:'干瞪眼',
      intro:'<h4>炸弹规则</h4><table><tr><th>牌型</th><th>说明</th><th>倍数</th></tr><tr><td>三软炸</td><td>王或3 + 两张相同点数</td><td class="mult">×2</td></tr><tr><td>三硬炸</td><td>3张相同点数（不含王/3当癞子）</td><td class="mult">×2</td></tr><tr><td>四软炸</td><td>王或3 + 三张相同点数</td><td class="mult">×2</td></tr><tr><td>四硬炸</td><td>4张相同点数</td><td class="mult">×2</td></tr><tr><td>五炸</td><td>王或3 + 四张相同点数</td><td class="mult">×5</td></tr><tr><td>六炸</td><td>王或3 + 五张相同点数</td><td class="mult">×5</td></tr><tr><td>王炸</td><td>大王+小王</td><td class="mult">×6</td></tr><tr><td>全关</td><td>一人出完，其余未出一张</td><td class="mult">×4</td></tr></table><p class="sub">炸弹大小：三软炸 &lt; 三硬炸 &lt; 四软炸 &lt; 四硬炸 &lt; 五炸 &lt; 六炸 &lt; 王炸</p>',
      rule:'<h4>玩法说明</h4><p>用一副扑克去掉一张3，共53张，4名玩家。</p><p>从首出玩家开始逆时针出牌；一轮结束后由最后出牌玩家开始，每人补一张牌，进入下一轮。有人出完则游戏结束。</p><p>牌抓完则凭手上牌继续对局。行牌压制按点数+1增长，<span class="tag">3和王是癞子</span>可变任意点数；<span class="tag">2可无视压制</span>顺序任意压制同类牌型。</p><p class="sub">注意：王不能单独打出。</p>'
    },
    gd:{
      title:'掼蛋',
      intro:'<h4>基本牌型</h4><table><tr><th>牌型</th><th>说明</th></tr><tr><td>单张/对子</td><td>1张/2张相同点数</td></tr><tr><td>顺子</td><td>5张相邻点数，A只能在头或尾</td></tr><tr><td>三张/三带二</td><td>3张相同；3张相同带1对子</td></tr><tr><td>同花顺</td><td>5张相邻且花色相同</td></tr><tr><td>炸弹</td><td>4张及以上相同点数</td></tr><tr><td>钢板</td><td>2组3张相邻点数，不能带其他</td></tr></table><h4>加倍系数</h4><p>4张炸弹 <span class="mult">×2</span>　5张炸弹 <span class="mult">×3</span>　同花顺 <span class="mult">×4</span>　6张及以上炸弹 <span class="mult">×5</span></p>',
      rule:'<h4>核心机制</h4><p><span class="tag">逢人配</span>红桃级牌可当任意一张牌组成最大牌型；单独打出视为普通级牌。</p><p><span class="tag">级牌</span>每轮随机一个数字作为级牌，大小：大王&gt;小王&gt;级牌&gt;A。</p><p><span class="tag">接风</span>玩家出完手牌后，若无人跟牌则其队友得优先出牌权。</p><h4>结算</h4><p>头游产生后加倍系数不再变化；最终金额 = 场次底分 × 加倍系数 × 排名倍数。</p><p>玩家当局能赢的最大豆子数不超过自身携带豆子。</p>'
    },
    k510:{
      title:'510K',

  /* ================= 计分引擎（纯函数，可测试） ================= */
  function computeDdz(info, n){
    var M = info.bidM * Math.pow(2, info.bombs + (info.rocket?1:0) + (info.spring?1:0) + (info.anti?1:0));
    var unit = info.base * M;
    var pts = new Array(n).fill(0);
    for(var i=0;i<n;i++) pts[i] = (i===info.landlord) ? (info.landlordWin ? (n-1)*unit : -(n-1)*unit) : (info.landlordWin ? -unit : unit);
    return { pts:pts, unit:unit, M:M };
  }
  function computePdk(info, n){
    var base = info.base || 1;
    var bombFactor = Math.pow(2, info.bombs || 0);
    var spring = info.pdkSpring ? 2 : 1;
    var unit = base * bombFactor * spring;
    var sum = 0, pts = new Array(n).fill(0);
    for(var i=0;i<n;i++){
      if(i===info.winner) continue;
      var rem = (info.remain && info.remain[i]) ? info.remain[i] : 0;
      var penalty = 1;
      if(info.quanGuan) penalty = 3;
      else if(rem>=8 && rem<=15) penalty = 2;
      pts[i] = -rem * unit * penalty;
      sum += rem * unit * penalty;
    }
    pts[info.winner] = sum;
    return { pts:pts, unit:unit };
  }
  // 干瞪眼：剩余牌 × 底分 × 炸弹倍数 × 全关倍数，赢家收全部。
  function computeGdy(info, n){
    var base = info.base || 1;
    var mult = info.bombMult || 1;
    var qg = info.quanGuan ? 4 : 1;
    var unit = base * mult * qg;
    var sum = 0, pts = new Array(n).fill(0);
    for(var i=0;i<n;i++){
      if(i===info.winner) continue;
      var rem = (info.remain && info.remain[i]) ? info.remain[i] : 0;
      pts[i] = -rem * unit;
      sum += rem * unit;
    }
    pts[info.winner] = sum;
    return { pts:pts, unit:unit };
  }
  // 510K：简化记分，按抓分、头游、倍数结算。
  function compute510k(info, n){
    var base = info.base || 1;
    var mult = info.mult || 1;
    var bonus = (typeof info.bonus==='number') ? info.bonus : 30;
    var total = 0;
    for(var i=0;i<n;i++) total += (info.points && info.points[i]) ? info.points[i] : 0;
    var avg = total / n;
    var pts = new Array(n).fill(0);
    for(var i=0;i<n;i++){
      var p = (info.points && info.points[i]) ? info.points[i] : 0;
      pts[i] = Math.round((p - avg + (i===info.winner ? bonus : 0)) * base * mult);
    }
    return { pts:pts, unit:base*mult };
  }
  function computeZjh(info, n){
    var pts = new Array(n).fill(0);
    for(var i=0;i<n;i++) pts[i] = (i===info.winner) ? (n-1)*info.stake : -info.stake;
    return { pts:pts, unit:info.stake };
  }
  function computeNn(info, n){
    var pts = new Array(n).fill(0);
    var b = info.banker;
    for(var i=0;i<n;i++){
      if(i===b) continue;
      var ti = NIU_DEFS[info.types[i]].strength, tb = NIU_DEFS[info.types[b]].strength;
      var mi = NIU_DEFS[info.types[i]].mult,    mb = NIU_DEFS[info.types[b]].mult;
      if(ti > tb){ pts[i] += mi*info.stake; pts[b] -= mi*info.stake; }
      else { pts[i] -= mb*info.stake; pts[b] += mb*info.stake; }
    }
    return { pts:pts };
  }
  // 德州扑克：赢家收池，各输家输额可不同（覆盖跟注/加注/全下），零和。
  function computeTexas(info, n){
    var pts = new Array(n).fill(0);
    var sum = 0;
    for(var i=0;i<n;i++){
      if(i===info.winner) continue;
      var loss = (info.losses && info.losses[i]) ? info.losses[i] : 0;
      pts[i] = -loss; sum += loss;
    }
    pts[info.winner] = sum;
    return { pts:pts, pot:sum };
  }
  // 21点：庄家 vs 各闲家，结果 0平/1赢/2黑杰克/3输/4爆。
  function computeBj(info, n){
    var pts = new Array(n).fill(0);
    var b = info.banker;
    for(var i=0;i<n;i++){
      if(i===b) continue;
      var r = (info.results && typeof info.results[i]==='number') ? info.results[i] : 1;
      var m = 0;
      if(r===1) m = 1;            // 普通赢
      else if(r===2) m = 1.5;     // 黑杰克 1.5 倍
      else if(r===3 || r===4) m = -1; // 输 / 爆牌
      // r===0 平局 m=0
      pts[i] += Math.round(m * info.stake * 2) / 2;   // 避免 0.5 浮点误差
      pts[b] -= Math.round(m * info.stake * 2) / 2;
    }
    return { pts:pts };
  }
  // 掼蛋：升级制，每局赢家 +升级数（双下默认×2），累计先到 A(14) 胜。
  function computeGuandan(info, n){
    var pts = new Array(n).fill(0);
    pts[info.winner] = info.up || 1;
    return { pts:pts };
  }
  function compute(info){
    if(curMode==='ddz') return computeDdz(info, S.players.length);
    if(curMode==='pdk') return computePdk(info, S.players.length);
    if(curMode==='gdy') return computeGdy(info, S.players.length);
    if(curMode==='zjh') return computeZjh(info, S.players.length);
    if(curMode==='texas') return computeTexas(info, S.players.length);
    if(curMode==='bj') return computeBj(info, S.players.length);
    if(curMode==='k510') return compute510k(info, S.players.length);
    if(curMode==='gd') return computeGuandan(info, S.players.length);
    return computeNn(info, S.players.length);
  }

  /* ---- 通用 stepper 绑定 ---- */
  function bindStepper(id, onChg, min, max){
    var inp = $(id); if(!inp) return;
    var mns = $(id+'Minus'), pls = $(id+'Plus');
    function apply(v){ v = Math.max(min, Math.min(max, parseInt(v,10)||min)); inp.value=v; onChg(v); }
    if(mns) mns.onclick = function(){ apply(parseInt(inp.value,10)-1); };
    if(pls) pls.onclick = function(){ apply(parseInt(inp.value,10)+1); };
    inp.oninput = function(){ apply(parseInt(inp.value,10)); };
  }

  /* ================= 历史 ================= */
  function renderHist(){
    var box = $('histList'); box.innerHTML='';
    if(!S.rounds.length){ box.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:14px">还没有对局记录</div>'; return; }
    S.rounds.slice().reverse().forEach(function(r,ri){
      var idx = S.rounds.length - ri;
      var detail = r.pts.map(function(v,i){ return esc(S.players[i])+' '+signed(v); }).join('，');
      var h = document.createElement('div'); h.className='h';
      h.innerHTML = '<span>第'+idx+'局 · '+r.label+'<small>'+detail+'</small></span>';
      box.appendChild(h);
    });
  }
  function roundLabel(info){
    if(curMode==='ddz') return (info.landlordWin?'地主胜':'地主负')+'（×'+(info.bidM*Math.pow(2,info.bombs+(info.rocket?1:0)+(info.spring?1:0)+(info.anti?1:0)))+'）';
    if(curMode==='pdk') return S.players[info.winner]+' 赢（关牌'+(info.pdkSpring?'×2':'×1')+(info.bombs?' · 炸弹'+info.bombs:'')+'）';
    if(curMode==='gdy') return S.players[info.winner]+' 赢（炸弹×'+(info.bombMult||1)+(info.quanGuan?' · 全关':'')+'）';
    if(curMode==='zjh') return S.players[info.winner]+' 赢（底注 '+info.stake+'）';
    if(curMode==='texas') return S.players[info.winner]+' 收池';
    if(curMode==='bj') return '庄家 '+S.players[info.banker]+'（底注 '+info.stake+'）';
    if(curMode==='k510') return S.players[info.winner]+' 头游（×'+info.mult+'）';
    if(curMode==='gd') return S.players[info.winner]+' 升 '+(info.up||1)+' 级';
    return '庄家 '+S.players[info.banker]+'（底注 '+info.stake+'）';
  }

  /* ================= 动作 ================= */
  function rename(i){
    var name = prompt('给「'+S.players[i]+'」改个名字：', S.players[i]);
    if(name==null) return;
    name = name.trim();
    if(name){ S.players[i]=name; save(); renderAll(); toast('已改名'); }
  }
  function commit(){
    var res = compute(CUR);
    var info = JSON.parse(JSON.stringify(CUR));
    for(var i=0;i<S.players.length;i++) S.totals[i] += res.pts[i];
    S.rounds.push({ pts:res.pts.slice(), info:info, label:roundLabel(info), at:Date.now() });
    resetCUR();
    save(); renderAll(); speak();
    toast('已结算本局');
  }
  function undo(){
    if(!S.rounds.length){ toast('没有可撤销的局'); return; }
    var last = S.rounds.pop();
    for(var i=0;i<S.players.length;i++) S.totals[i] -= last.pts[i];
    save(); renderAll(); toast('已撤销上一局');
  }
  function resetAll(){
    if(!confirm('确定重置全部？所有分数会清空。')) return;
    S.totals = S.players.map(function(){return 0;});
    S.rounds = [];
    resetCUR();
    save(); renderAll(); toast('已重置');
  }
  function setCount(n){
    var m = MODES[curMode];
    n = Math.max(m.min, Math.min(m.max, n));
    if(n === S.players.length) return;
    if(S.rounds.length && !confirm('调整人数会清空当前对局分数，确定继续？')) return;
    var old = S.players.slice();
    S.players = [];
    for(var i=0;i<n;i++) S.players.push(old[i] || ('玩家'+(i+1)));
    S.totals = S.players.map(function(){return 0;});
    S.rounds = [];
    resetCUR(); save(); renderAll();
  }
  function switchMode(mode){
    if(mode === curMode) return;
    save();
    curMode = mode;
    S = load(mode);
    resetCUR();
    save();
    renderAll();
  }

  /* ================= 主渲染 ================= */
  function renderAll(){
    renderTabs();
    renderCount();
    renderPlayers();
    renderSettle();
    renderBoard();
    renderHist();
    $('voiceSw').classList.toggle('on', S.voiceOn);
    $('settleTitle').textContent = MODES[curMode].label + ' · 本局结算';
  }

  /* ================= 语音 ================= */
  function speak(){
    if(!S.voiceOn || !('speechSynthesis' in window)) return;
    try{
      var order = S.players.map(function(_,i){return i;}).sort(function(a,b){return S.totals[b]-S.totals[a];});
      var txt = order.map(function(i,pos){ return (pos+1)+'. '+S.players[i]+' '+S.totals[i]+'分'; }).join('，');
      var u = new SpeechSynthesisUtterance(txt); u.lang='zh-CN'; u.rate=1;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ================= 主题 ================= */
  function applyGlobalTheme(){ try{ var g=localStorage.getItem('cabo-theme'); if(g==='light'||g==='dark') document.documentElement.dataset.theme=g; }catch(e){} }
  applyGlobalTheme();
  (function(){ var tb=$('themeBtn'); if(!tb) return;
    function sync(){ tb.textContent = document.documentElement.dataset.theme==='light' ? '🌙' : '☀️'; }
    sync();
    tb.onclick=function(){ var c=document.documentElement.dataset.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=c; sync(); try{localStorage.setItem('cabo-theme',c);}catch(e){} };
  })();

  /* ================= 事件 ================= */
  $('modeTabs').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ switchMode(b.dataset.mode); }; });
  $('countMinus').onclick=function(){ setCount(S.players.length-1); };
  $('countPlus').onclick=function(){ setCount(S.players.length+1); };
  $('commitBtn').onclick=commit;
  $('undoBtn').onclick=undo;
  $('resetBtn').onclick=resetAll;
  $('voiceSw').onclick=function(){ S.voiceOn=!S.voiceOn; this.classList.toggle('on',S.voiceOn); save(); };

  /* ================= 启动 ================= */
  S = load(curMode);
  resetCUR();
  renderAll();
})();
</script>
</body>
</html>
