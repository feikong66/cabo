<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>许愿 · Cabo Scorer</title>
<style>
  :root{
    --bg:#070b18; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.12);
    --txt:#f5f7ff; --sub:#9aa6c4; --muted:#6b7a99;
    --gold:#ffc85a; --gold2:#ff8f4f; --pink:#ff7ab8; --violet:#8a7bff;
    --input-bg:rgba(255,255,255,.06); --ok:#4ade80; --err:#ff7a90;
  }
  :root[data-theme="light"]{
    --bg:#eef2fb; --card:rgba(255,255,255,.7); --line:rgba(20,40,90,.12);
    --txt:#16203a; --sub:#5a6b8c; --muted:#7a89a8;
    --gold:#e8a020; --gold2:#ff7a3c; --pink:#e84a9a; --violet:#6a5cff;
    --input-bg:rgba(255,255,255,.8); --ok:#16a34a; --err:#e11d48;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt);min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(1100px 700px at 15% -5%, rgba(138,123,255,.20) 0%, transparent 55%),
      radial-gradient(900px 600px at 90% 10%, rgba(255,122,184,.16) 0%, transparent 50%),
      radial-gradient(1000px 700px at 50% 110%, rgba(255,200,90,.14) 0%, transparent 55%),
      var(--bg);
  }
  /* 流动光晕层 */
  .aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
  .aurora span:nth-child(1){width:420px;height:420px;left:-80px;top:-60px;background:rgba(138,123,255,.5)}
  .aurora span:nth-child(2){width:360px;height:360px;right:-70px;top:20%;background:rgba(255,122,184,.42);animation-delay:-6s}
  .aurora span:nth-child(3){width:460px;height:460px;left:30%;bottom:-140px;background:rgba(255,180,60,.38);animation-delay:-12s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,24px) scale(.94)}}
  canvas#stars{position:fixed;inset:0;z-index:1;pointer-events:none}

  .wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:40px 18px 70px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--pink));
    display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 30px rgba(255,170,60,.35);animation:spinGlow 5s ease-in-out infinite}
  @keyframes spinGlow{0%,100%{box-shadow:0 8px 26px rgba(255,170,60,.30)}50%{box-shadow:0 8px 44px rgba(255,140,80,.55)}}
  .brand{font-size:19px;font-weight:800}
  .brand small{display:block;font-size:11px;color:var(--sub);font-weight:500;letter-spacing:2px}
  .back{margin-left:auto;color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:7px 13px;border-radius:10px;background:var(--card);backdrop-filter:blur(8px)}
  .theme-btn{margin-left:8px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:15px;cursor:pointer;backdrop-filter:blur(8px)}

  .hero{text-align:center;margin:26px 0 22px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .hero h1{font-size:30px;margin:0 0 8px;font-weight:900;
    background:linear-gradient(100deg,var(--gold),var(--gold2) 45%,var(--pink) 80%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .hero p{margin:0;color:var(--sub);font-size:14px;line-height:1.7}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.25);animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px;font-weight:600}
  input,textarea,select{width:100%;background:var(--input-bg);border:1px solid var(--line);color:var(--txt);
    border-radius:13px;padding:13px 14px;font-size:15px;outline:none;transition:border .18s,box-shadow .18s}
  textarea{resize:vertical;min-height:110px;line-height:1.6}
  input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,90,.15)}
  select option{color:#16203a;background:#fff}
  .cats{display:flex;gap:8px;flex-wrap:wrap}
  .cats button{flex:1;min-width:64px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--input-bg);
    color:var(--sub);font-size:13px;cursor:pointer;transition:.15s}
  .cats button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2500;border-color:transparent;font-weight:700}
  .char-tip{font-size:11px;color:var(--muted);text-align:right;margin-top:5px}
  .submit{display:block;width:100%;padding:16px;border:none;border-radius:15px;cursor:pointer;font-size:16px;font-weight:800;color:#3a2500;
    background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 8px 26px rgba(255,160,50,.4);transition:transform .12s,box-shadow .2s}
  .submit:active{transform:scale(.97)}
  .submit:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;text-align:center;font-size:14px;min-height:20px;line-height:1.5}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .wish-list{margin-top:26px;animation:rise .7s .16s cubic-bezier(.2,.8,.2,1) both}
  .wish-list h2{font-size:14px;color:var(--sub);margin:0 0 12px;text-align:center;letter-spacing:1px}
  .w-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;backdrop-filter:blur(8px);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .w-item .main{flex:1;min-width:0}
  .w-item .t{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .w-item .badge{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
  .w-item .badge.done{border-color:var(--ok);color:var(--ok)}
  .w-item .badge.reject{border-color:var(--muted);color:var(--muted)}
  .w-item .d{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
  .w-item .c{font-size:11px;color:var(--muted);margin-top:6px}
  .w-item .vote{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--input-bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;transition:.15s;color:var(--sub)}
  .w-item .vote:hover{border-color:var(--gold)}
  .w-item .vote.voted{border-color:var(--gold);color:var(--gold);background:rgba(255,200,90,.12)}
  .w-item .vote .n{font-size:18px;font-weight:800;color:var(--txt);line-height:1}
  .w-item .vote.voted .n{color:var(--gold)}
  .w-item .vote .lb{font-size:10px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;font-size:13px;padding:18px}

  /* 提交成功撒花爆发层 */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<canvas id="stars"></canvas>
<canvas id="confetti"></canvas>

<div class="wrap">
  <header>
    <div class="logo">🌠</div>
    <div class="brand">许个愿望<small>MAKE A WISH</small></div>
    <button class="theme-btn" id="themeBtn" title="切换深色/浅色">🌙</button>
    <a class="back" href="index.html">← 首页</a>
  </header>

  <section class="hero">
    <h1>想要什么新功能？</h1>
    <p>告诉作者你想加什么。愿望直达云端后台，你还能给别人的愿望投票，票数高的作者会优先做 ✨</p>
  </section>

  <div class="card">
    <div class="field">
      <label>愿望分类</label>
      <div class="cats" id="catBox">
        <button data-c="功能建议" class="on">功能建议</button>
        <button data-c="游戏模式">游戏模式</button>
        <button data-c="界面优化">界面优化</button>
        <button data-c="语音相关">语音相关</button>
        <button data-c="其他">其他</button>
      </div>
    </div>
    <div class="field">
      <label>愿望标题 *</label>
      <input id="wTitle" maxlength="200" placeholder="例如：加一个「德州扑克」模式">
    </div>
    <div class="field">
      <label>详细描述</label>
      <textarea id="wDesc" maxlength="2000" placeholder="说说你希望它长什么样、怎么用…（选填）"></textarea>
      <div class="char-tip" id="descTip">0 / 2000</div>
    </div>
    <div class="field">
      <label>联系方式（选填）</label>
      <input id="wContact" maxlength="120" placeholder="微信 / 邮箱等，方便我联系你反馈进度">
    </div>
    <button class="submit" id="submitBtn">✨ 许下愿望</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="wish-list">
    <h2>✨ 大家的愿望（点 👍 投票）</h2>
    <div id="wishList"><div class="empty">加载中…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2400);}

  /* ---- API 探测（与首页一致） ---- */
  function getApi(){
    try{ var c=localStorage.getItem('cabo-api'); if(c) return c; }catch(e){}
    var h=location.hostname;
    if(h.endsWith('.tcloudbaseapp.com')){ var sub=h.split('.')[0]; var env=sub.replace(/-(\d+)$/, ''); return 'https://'+env+'.service.tcloudbase.com'; }
    return '';
  }
  var API = getApi();

  /* ---- 主题 ---- */
  function applyTheme(){ try{ var g=localStorage.getItem('cabo-theme'); if(g==='light'||g==='dark') document.documentElement.dataset.theme=g; }catch(e){} }
  applyTheme();
  (function(){ var tb=$('themeBtn'); if(!tb) return;
    function sync(){ tb.textContent = document.documentElement.dataset.theme==='light' ? '🌙' : '☀️'; }
    sync();
    tb.onclick=function(){ var c=document.documentElement.dataset.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=c; sync(); try{localStorage.setItem('cabo-theme',c);}catch(e){} };
  })();

  /* ---- 星星粒子背景 ---- */
  (function(){
    var cv=$('stars'),ctx=cv.getContext('2d');var stars=[];var W,H,dpr;
    function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
    function seed(){ stars=[]; var n=Math.floor(innerWidth/14); for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,s:Math.random()*1.4+.4,a:Math.random()*.6+.3,tw:Math.random()*Math.PI*2}); }
    resize(); seed(); addEventListener('resize',function(){resize();seed();});
    var GOLD=['#ffd76a','#ffb454','#ff9d66','#ffd6e8','#c9c2ff'];
    (function tick(t){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<stars.length;i++){
        var p=stars[i]; p.y-=p.s*dpr; p.tw+=.03;
        if(p.y< -4){ p.y=H+4; p.x=Math.random()*W; }
        var al=p.a*(0.6+0.4*Math.sin(p.tw));
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*dpr,0,Math.PI*2);
        ctx.fillStyle=GOLD[i%GOLD.length];ctx.globalAlpha=al;ctx.fill();
      }
      ctx.globalAlpha=1; requestAnimationFrame(tick);
    })(0);
  })();

  /* ---- 分类选择 ---- */
  var curCat='功能建议';
  $('catBox').querySelectorAll('button').forEach(function(b){ b.onclick=function(){
    curCat=b.dataset.c; $('catBox').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
  }; });

  /* ---- 字数统计 ---- */
  $('wDesc').oninput=function(){ $('descTip').textContent=this.value.length+' / 2000'; };

  /* ---- 撒花爆发 ---- */
  function confettiBurst(){
    var cv=$('confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
    var ps=[];var COLORS=['#ffc85a','#ff8f4f','#ff7ab8','#8a7bff','#4ade80','#34d399','#f472b6'];
    for(var i=0;i<160;i++) ps.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-13-3,g:.42,r:Math.random()*4+3,c:COLORS[i%COLORS.length],rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.4,shape:Math.random()>.5});
    var t0=Date.now();
    (function tick(){
      ctx.clearRect(0,0,cv.width,cv.height);
      var el=Date.now()-t0;
      for(var i=0;i<ps.length;i++){ var p=ps[i]; p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-el/2200);
        if(p.shape){ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);}else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}
        ctx.restore(); }
      ctx.globalAlpha=1;
      if(el<2200) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
    })();
  }

  /* ---- 提交 ---- */
  $('submitBtn').onclick=async function(){
    var title=$('wTitle').value.trim();
    var msg=$('msg');
    if(!title){ msg.textContent='请先填个愿望标题～'; msg.className='msg err'; $('wTitle').focus(); return; }
    if(!API){ msg.textContent='当前环境未连接云端（本地预览），无法提交。'; msg.className='msg err'; return; }
    var btn=$('submitBtn'); btn.disabled=true; btn.textContent='🌠 正在许愿…'; msg.textContent=''; msg.className='msg';
    try{
      var r=await fetch(API+'/api/wishes',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title:title,desc:$('wDesc').value.trim(),category:curCat,contact:$('wContact').value.trim()})});
      var d=await r.json().catch(function(){return {};});
      if(!r.ok){ msg.textContent='提交失败：'+(d.error||r.status)+'（可能太频繁了，稍后再试）'; msg.className='msg err'; }
      else{
        msg.textContent='✨ 愿望已送达云端！作者会在后台看到它。'; msg.className='msg ok';
        confettiBurst(); toast('🌠 许愿成功，谢谢你的反馈！');
        $('wTitle').value=''; $('wDesc').value=''; $('wContact').value=''; $('descTip').textContent='0 / 2000';
      }
    }catch(e){ msg.textContent='网络异常：'+(e&&e.message||e); msg.className='msg err'; }
    btn.disabled=false; btn.textContent='✨ 许下愿望';
  };

  /* ---- 愿望列表 + 投票 ---- */
  var VOTED_KEY = 'cabo-wish-voted';
  function votedSet(){ try{ return JSON.parse(localStorage.getItem(VOTED_KEY)||'[]'); }catch(e){ return []; } }
  function hasVoted(id){ return votedSet().indexOf(id) >= 0; }
  function markVoted(id){ try{ var a=votedSet(); if(a.indexOf(id)<0){ a.push(id); localStorage.setItem(VOTED_KEY, JSON.stringify(a)); } }catch(e){} }
  function statusBadge(s){
    if(s==='已完成') return '<span class="badge done">✅ 已完成</span>';
    if(s==='已采纳') return '<span class="badge done">🌟 已采纳</span>';
    if(s==='已拒绝') return '<span class="badge reject">已拒绝</span>';
    return '<span class="badge">⏳ 待处理</span>';
  }
  async function loadWishList(){
    var box=$('wishList');
    if(!API){ box.innerHTML='<div class="empty">云端未连接，暂无法加载愿望</div>'; return; }
    try{
      var r=await fetch(API+'/api/wishes',{cache:'no-store'});
      var d=await r.json().catch(function(){return {};});
      var items=(d.items||[]);
      if(!items.length){ box.innerHTML='<div class="empty">还没有愿望，快来许下第一个吧 ✨</div>'; return; }
      box.innerHTML=items.map(function(w){
        var voted=hasVoted(w._id);
        return '<div class="w-item"><div class="main"><div class="t"><span>'+esc(w.title)+'</span>'+statusBadge(w.status)+'</div>'
          +(w.desc?'<div class="d">'+esc(w.desc)+'</div>':'')
          +'<div class="c">'+(w.category?esc(w.category)+' · ':'')+(w.created_at?esc(String(w.created_at).replace('T',' ').slice(0,10)):'')+'</div></div>'
          +'<button class="vote'+(voted?' voted':'')+'" data-id="'+esc(w._id)+'" data-votes="'+w.votes+'"><span class="n">'+(voted?'❤️':w.votes)+'</span><span class="lb">'+(voted?'已投':'投票')+'</span></button></div>';
      }).join('');
      box.querySelectorAll('.vote').forEach(function(b){ b.onclick=function(){ vote(b.getAttribute('data-id'), b); }; });
    }catch(e){ box.innerHTML='<div class="empty">加载失败，点此重试</div>'; box.onclick=loadWishList; }
  }
  async function vote(id, btn){
    if(!API) return;
    if(hasVoted(id)){ toast('你已经投过票啦'); return; }
    btn.disabled=true;
    try{
      var r=await fetch(API+'/api/wishes/'+id+'/vote',{method:'POST',headers:{'Content-Type':'application/json'}});
      var d=await r.json().catch(function(){return {};});
      if(r.status===409){ toast('你已经投过票啦'); markVoted(id); }
      else if(r.ok){ markVoted(id); var n=(typeof d.votes==='number')?d.votes:((+btn.dataset.votes)+1); btn.innerHTML='<span class="n">❤️</span><span class="lb">已投</span>'; btn.classList.add('voted'); toast('👍 已投一票'); }
      else{ toast('投票失败：'+(d.error||r.status)); }
    }catch(e){ toast('网络异常：'+(e&&e.message||e)); }
    btn.disabled=false;
  }
  loadWishList();
})();
</script>
</body>
</html>
