<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>卡波计分 · Cabo Scorer</title>
<link rel="manifest" href="manifest-60.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2e7d52">
<style>
:root{
 --bg:#eef2f0; --card:#ffffff; --accent:#2bb673; --accent-2:#1f9d5e;
 --text:#16201c; --muted:#69786f; --danger:#e05a4d; --line:#e4eae6;
 --gold:#f5b50a; --radius:16px;
 --shadow:0 1px 2px rgba(20,40,30,.05), 0 8px 24px rgba(20,40,30,.06);
 --shadow-lg:0 12px 40px rgba(20,40,30,.14);
 --input-bg:#f7faf8;
 --cabo:#7c5cff; --cabo-bg:rgba(124,92,255,.10);
}
:root[data-theme="dark"]{
 --bg:#0d1411; --card:#161f1b; --accent:#34d27f; --accent-2:#28b86b;
 --text:#e8efeb; --muted:#8ea29a; --danger:#ff7a6b; --line:#26302b;
 --gold:#ffce4d;
 --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
 --shadow-lg:0 16px 50px rgba(0,0,0,.5);
 --input-bg:#1d2823;
 --cabo:#a78bfa; --cabo-bg:rgba(167,139,250,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;
  background-image:radial-gradient(1100px 460px at 50% -220px, rgba(43,182,115,.14), transparent 70%);
  -webkit-font-smoothing:antialiased;}
:root[data-theme="dark"] body{background-image:radial-gradient(1100px 460px at 50% -220px, rgba(52,210,127,.12), transparent 70%);}
.app{max-width:560px;margin:0 auto;padding:18px 14px 60px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
h1 .badge{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;letter-spacing:.5px}
h1 .ver{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--line);border-radius:7px;padding:1px 6px;margin-left:2px}
.header-actions{display:flex;gap:8px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:12px;padding:12px 14px;background:var(--card);color:var(--text);box-shadow:var(--shadow);transition:transform .06s ease, filter .15s, background .2s, box-shadow .2s}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;font-size:17px;padding:15px;border:none;box-shadow:0 6px 18px rgba(31,157,94,.28)}
:root[data-theme="dark"] button.primary{box-shadow:0 6px 18px rgba(40,184,107,.25)}
button.primary:disabled{opacity:.5;filter:grayscale(.3);box-shadow:none}
button.ghost{background:transparent;box-shadow:none;color:var(--muted);border:1px solid var(--line)}
button.danger{color:var(--danger);background:transparent;box-shadow:none}
button:disabled{cursor:default}
.icon-btn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0;border-radius:12px}
.btn-kami{background:linear-gradient(135deg,#ff7a45,#e53935);color:#fff;font-weight:700;border:none;box-shadow:0 6px 18px rgba(229,57,53,.28)}
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.setup-card h2{margin:0 0 16px;font-size:19px;font-weight:700}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:9px;font-weight:600;letter-spacing:.3px}
.seg{display:flex;gap:8px;background:var(--input-bg);padding:5px;border-radius:14px}
.seg button{flex:1;background:transparent;box-shadow:none;color:var(--muted);font-weight:600;border-radius:10px}
.seg button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--shadow)}
.mini-seg{display:flex;gap:6px;background:var(--input-bg);padding:4px;border-radius:12px}
.mini-seg button{flex:1;background:transparent;box-shadow:none;color:var(--muted);font-weight:600;border-radius:9px;font-size:13px;padding:8px 6px}
.mini-seg button.active{background:var(--accent);color:#fff}
.name-row{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.name-row .pidx{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;font-size:15px;box-shadow:0 3px 9px rgba(31,157,94,.25)}
input[type=number],input[type=text]{width:100%;padding:12px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--input-bg);color:var(--text);font-family:inherit;transition:border-color .2s, box-shadow .2s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,182,115,.15)}
.row2{display:flex;gap:10px}
.row2>div{flex:1;min-width:0}
@media (max-width:400px){ .row2{flex-direction:column;gap:0} }
.preset-row{display:flex;gap:8px;margin-top:9px}
.preset{flex:1;background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:none}
.preset.on{background:var(--accent);color:#fff;border-color:transparent}
.round-info{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:2px 4px 14px;font-weight:600}
.player-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;animation:rise .25s ease both;transition:box-shadow .3s, border-color .3s}
.player-card.lead{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold), 0 10px 26px rgba(245,181,10,.28)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:8px}
.pc-name{font-size:17px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:2px 4px;margin:-2px -4px}
.pc-name:active{background:var(--input-bg)}
.rank-badge{font-size:11px;font-weight:800;color:#fff;background:var(--muted);border-radius:7px;padding:1px 6px;flex:0 0 auto}
.player-card.lead .rank-badge{background:var(--gold);color:#5a3d00}
.pc-name .crown{margin-left:2px}
.pc-total{font-size:30px;font-weight:800;color:var(--accent);transition:color .3s;white-space:nowrap}
.pc-total small{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.pc-inputs{display:flex;gap:10px;align-items:flex-end}
.pc-inputs>div{flex:1;display:flex;flex-direction:column}
.pc-inputs .lab{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
.special-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.special-row{margin-bottom:12px}
.special-row:last-child{margin-bottom:0}
.special-label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;letter-spacing:.3px}
.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--input-bg);color:var(--text);border-radius:20px;padding:8px 13px;font-size:13.5px;font-weight:600;box-shadow:none;flex:0 0 auto}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.chip.cabo.on{background:var(--cabo);border-color:transparent}
/* Kamikaze 红色独立按钮 + 选人窗口 */
.kami-btn{width:100%;margin-top:2px;background:linear-gradient(135deg,#ff6060,#e53935);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;letter-spacing:.4px;box-shadow:0 10px 22px rgba(229,57,53,.32);cursor:pointer;transition:transform .12s,box-shadow .2s}
.kami-btn:active{transform:translateY(2px);box-shadow:0 6px 14px rgba(229,57,53,.30)}
.kami-btn:hover{box-shadow:0 14px 26px rgba(229,57,53,.40)}
.kami-intro{font-size:12px;color:var(--muted);margin:8px 0 0;text-align:center;line-height:1.5}
.kami-modal{max-width:460px;animation:kamiPop .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes kamiPop{0%{transform:scale(.92) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.kami-modal .muted{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.6}
.kami-modal .muted b{color:#e53935}
.kami-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:4px}
.kami-pick{display:flex;flex-direction:column;gap:5px;background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:16px 14px;font-size:16px;font-weight:700;text-align:left;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.kami-pick:hover{border-color:#e53935;box-shadow:0 6px 16px rgba(229,57,53,.18);transform:translateY(-2px)}
.kami-pick small{font-size:11.5px;font-weight:700;color:#e53935}
.kami-pick .others{font-size:11.5px;font-weight:600;color:var(--muted)}
.kami-pick.on{border-color:#e53935;background:rgba(229,57,53,.12);box-shadow:0 6px 16px rgba(229,57,53,.22)}
.muted{color:var(--muted)}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent, var(--bg) 24%);padding-top:12px;margin-top:8px}
.action-bar{display:flex;gap:10px;align-items:stretch}
.action-bar .primary{width:auto;flex:2;margin-bottom:0}
.action-bar .ghost{flex:1;margin-bottom:0}
.actions .primary{width:100%;margin-bottom:10px}
.action-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.action-row{display:flex;gap:12px;margin-bottom:12px}
.action-row:last-child{margin-bottom:0}
.action-row button{flex:1;min-height:48px;padding:13px 10px;font-size:15px;border-radius:12px}
.more-modal{max-height:84vh;overflow:auto}
.oplog-list{max-height:54vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.oplog-item{display:flex;gap:10px;align-items:baseline;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px}
.oplog-t{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 42px}
.oplog-d{flex:1;color:var(--text)}
.history{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.history h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.history .r{font-size:13.5px;padding:10px 12px;border:1px solid rgba(43,182,115,.30);border-radius:12px;margin-bottom:8px;background:var(--card);box-shadow:0 1px 3px rgba(20,40,30,.05)}
:root[data-theme="dark"] .history .r{border:1px solid rgba(52,210,127,.35);background:rgba(52,210,127,.07)}
.history .r .r-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.history .r .rn{color:var(--muted);font-weight:700;flex:0 0 auto;font-size:12px;margin-top:1px}
.history .rn-kami{color:#e53935;font-weight:800;font-size:13px;line-height:1.1;margin-left:6px}
:root[data-theme="dark"] .history .rn-kami{color:#ff8a80}
.history .r .parts{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin:0 8px;min-width:0;line-height:1.9}
.history .r .pname{font-weight:600}
.history .r .d{color:var(--accent);font-weight:700;margin-left:3px}
.history .r .d.neg{color:var(--danger)}
.history .r .r-rule{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.4}
.history .r .r-rule.kami{color:#b3261e}
:root[data-theme="dark"] .history .r .r-rule.kami{color:#ff9b91}
.history .r-tag{font-size:12px;padding:6px 10px;margin:-2px 0 8px;border-radius:10px;line-height:1.4}
.history .r-tag.cabo.ok{background:var(--cabo-bg);color:var(--cabo)}
.history .r-tag.cabo.fail{background:rgba(224,90,77,.10);color:var(--danger)}
.history .r-tag.kami{background:rgba(229,57,53,.10);color:#b3261e}
:root[data-theme="dark"] .history .r-tag.kami{background:rgba(229,57,53,.18);color:#ff9b91}
.history .r.r-kamikaze{border:1px solid rgba(229,57,53,.45);background:rgba(229,57,53,.06)}
:root[data-theme="dark"] .history .r.r-kamikaze{border:1px solid rgba(229,57,53,.55);background:rgba(229,57,53,.14)}
.history .r-event{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 8px;margin:6px 0 0;border-radius:10px;line-height:1.4}
.history .r-event .ev-emoji{font-size:15px;flex:0 0 auto}
.history .r-event b{font-weight:800}
.history .r-event.ev-hundred{background:rgba(255,179,0,.12);color:#8a5a00}
:root[data-theme="dark"] .history .r-event.ev-hundred{background:rgba(255,179,0,.16);color:#ffd76a}
.chart-wrap{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.chart-wrap h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:700}
.chart-wrap canvas{width:100%;height:240px;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(10,18,14,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.hidden{display:none}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal h2{margin:0 0 12px;font-size:19px;font-weight:700}
.go-win{text-align:center;padding:6px 0}
.go-win .trophy{font-size:54px;animation:pop .5s ease both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.go-win .who{font-size:24px;font-weight:800;color:var(--accent);margin:6px 0}
.go-list{margin:14px 0;text-align:left}
.go-list .li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.go-list .li.win{font-weight:700;color:var(--accent)}
.go-list .li .rk{color:var(--muted);font-weight:700;margin-right:8px}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions button{flex:1}
.hidden{display:none!important}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(22,32,28,.94);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1}
.rules-block{margin-top:8px;border-top:1px solid var(--line);padding-top:14px}
.rules-block>label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:700}
.rule-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rule-row:last-child{border-bottom:none}
.rule-row .desc{flex:1;line-height:1.4}
.rule-row .desc small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:400;line-height:1.5}
.mode-hint{font-size:12px;color:var(--muted);background:var(--input-bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 10px;margin:-4px 0 10px;line-height:1.6}
.mode-hint b{color:var(--text)}
.rule-row input[type=number]{width:58px;padding:7px;display:inline-block;font-size:15px;margin:0 2px}
.toggle{min-width:58px;padding:8px 14px;border-radius:20px;background:var(--input-bg);color:var(--muted);font-weight:700;font-size:13px;box-shadow:none;border:1px solid var(--line)}
.toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.event-banner{position:fixed;top:0;left:50%;transform:translate(-50%,-140%);z-index:70;background:linear-gradient(135deg,#ffd54f,#ffb300);color:#5a3d00;padding:16px 24px;border-radius:0 0 22px 22px;box-shadow:0 12px 34px rgba(255,160,0,.45);text-align:center;min-width:260px;transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
.event-banner.show{transform:translate(-50%,0)}
.event-banner.kamikaze{background:linear-gradient(135deg,#ff7043,#e53935);color:#fff}
.eb-emoji{font-size:34px;animation:pop .5s ease both}
.eb-title{font-size:21px;font-weight:800;margin:2px 0}
.eb-sub{font-size:14px;opacity:.95}
.note{color:var(--muted);font-size:13px;margin:-2px 0 14px}
.rules-ref{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--input-bg);padding:0;overflow:hidden}
.rules-ref summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;color:var(--text)}
.rules-ref .rf-body{padding:0 16px 14px;font-size:13px;color:var(--muted);line-height:1.7}
.rules-ref .rf-body b{color:var(--text)}
.rules-ref .rf-body ul{margin:6px 0;padding-left:18px}
.rules-img{width:100%;border-radius:10px;margin-bottom:12px;border:1px solid var(--line);display:block;cursor:zoom-in}
/* ---- 官方说明书图库（缩略图 2 列，点开进大图灯箱） ---- */
.rules-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:2px 0 8px}
.rules-thumb{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);cursor:zoom-in;aspect-ratio:3/4;-webkit-tap-highlight-color:transparent}
.rules-gallery .rules-thumb:only-child{grid-column:1/-1;max-width:560px;width:100%;margin:0 auto;aspect-ratio:140/243;background:#fff}
.rules-gallery .rules-thumb:only-child img{object-fit:contain;object-position:center top;height:auto}
.rules-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;background:#fff}
.rules-thumb .rt-tag{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:11.5px;font-weight:700;padding:16px 6px 7px;text-align:center;letter-spacing:.2px;line-height:1.3}
.rules-thumb .rt-zoom{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;line-height:1.5}
.rules-thumb .rt-fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);padding:10px;line-height:1.5}
.rules-thumb.failed img{display:none}
.rules-thumb.failed .rt-fail{display:flex}
.rules-caption{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 12px;line-height:1.6}
/* ---- 可滚动 / 可放大的图片灯箱 ---- */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;overflow:auto;-webkit-overflow-scrolling:touch;padding:54px 0 44px;overscroll-behavior:contain}
.lightbox .lb-stage{min-height:100%;display:flex;align-items:flex-start;justify-content:flex-start}
.lightbox img{display:block;width:100%;max-width:1200px;height:auto;margin:0 auto;background:#fff;border-radius:6px}
.lightbox.zoom .lb-stage{justify-content:flex-start}
.lightbox.zoom img{width:400%;max-width:none;margin:0}
.lb-bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:rgba(0,0,0,.78);z-index:101}
.lb-bar .lb-title{color:#fff;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-btns{display:flex;gap:8px;flex:0 0 auto}
.lb-btns button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:18px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:none}
.lb-tip{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.72);font-size:12px;z-index:101;pointer-events:none}
.rf-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.rf-card .rf-h{font-weight:700;color:var(--text);font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.rf-card ol{margin:6px 0 0;padding-left:20px}
.rf-card ol li{margin-bottom:4px}
.rf-note{font-size:12px;color:var(--muted);background:var(--input-bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 10px;margin-top:8px;line-height:1.6}
.rf-sec{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:16px 0 8px;text-transform:uppercase}
/* ---- 结束分数线：自定义输入 + 快捷预设，避免数字连成一排 ---- */
.es-input{position:relative}
.es-input input{padding-right:38px}
.es-input .es-unit{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none;font-weight:600}
.sub-label{font-size:11.5px;color:var(--muted);margin:10px 0 6px;font-weight:600}
/* ---- 玩家名输入区 ---- */
.name-row .name-field{flex:1;position:relative;min-width:0}
.name-row .name-field .nf-label{position:absolute;top:-8px;left:11px;background:var(--card);padding:0 6px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;border-radius:4px}
.name-row .name-field input{padding:13px 14px 11px}
.save-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.save-item--auto{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.save-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.save-name{font-weight:700;font-size:15px}
.save-time{color:var(--muted);font-size:12px;flex:0 0 auto}
.save-auto{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;flex:0 0 auto}
.save-sub{color:var(--muted);font-size:12.5px;margin:4px 0 9px;line-height:1.5}
.save-note{display:inline-block;background:var(--accent-soft,#eef4ff);color:var(--accent,#1a73e8);font-size:12px;border-radius:8px;padding:2px 8px;margin-bottom:6px}
.save-toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.save-toolbar input{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
.pc-right{display:flex;align-items:center;gap:8px}
.pc-adj{flex:0 0 auto;padding:3px 9px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--accent);cursor:pointer}
.pc-adj:active{transform:scale(.95)}
.save-actions{display:flex;gap:8px}
.mini{flex:1;padding:9px;border-radius:10px;font-size:13.5px;background:#f1f4f6;color:var(--text);box-shadow:none;font-weight:600}
.mini.danger{background:transparent;color:var(--danger);box-shadow:none}
.report-text{width:100%;height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--input-bg);color:var(--text);resize:vertical}
.report-preview{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
/* ---- 历史对局（首页） ---- */
.home-history{margin-top:18px}
.home-history .clear-all{width:100%;margin-top:2px}
/* ---- 本轮事件勾选（复选框 + 下拉） ---- */
.ev-check{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.ev-check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
.ev-sel{margin-left:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:14px;max-width:150px}
.ev-sel:disabled{opacity:.5}
.ev-hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.special-panel .special-row{margin-bottom:10px}
.special-panel .special-row:last-of-type{margin-bottom:0}
.sp-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.sp-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sp-btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(43,182,115,.18)}
.sp-btn.cabo.on{border-color:#3b82f6;background:rgba(59,130,246,.08);color:#1d4ed8}
.sp-btn.kami.on{border-color:var(--accent);background:rgba(43,182,115,.10);color:#1f7a4d}
.sp-cabo-card{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin-left:12px;padding:9px 26px 9px 14px;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(37,99,235,.32);font-size:13px;min-width:90px;text-align:center;animation:spCardIn .22s ease both}
.sp-cabo-label{font-size:11px;opacity:.85;letter-spacing:.5px}
.sp-cabo-card b{font-size:16px;font-weight:800}
.sp-cabo-card .sp-clear{position:absolute;top:-6px;right:-6px;background:#fff;color:#dc2626;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.sp-cabo-card .sp-clear:hover{background:#fee2e2}
.sp-clear{border:none;background:rgba(224,90,77,.12);color:#c0392b;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.sp-clear:hover{background:rgba(224,90,77,.25)}
@keyframes spCardIn{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* ---- 4 张小框录入 ---- */
.card4 .lab{display:block;margin-bottom:5px}
.card4-row{display:flex;gap:6px}
.c4{width:54px;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:16px;text-align:center}
.c4:focus{border-color:var(--accent)}
.cards-mini{display:inline-block;margin-left:6px;font-size:11px;color:var(--muted);background:var(--input-bg);border-radius:6px;padding:1px 6px}
.er-c4{display:flex;gap:6px}
.er-c4i{width:52px;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:15px;text-align:center}
/* ---- 对局记录行内操作 ---- */
.r-tools{display:inline-flex;gap:6px;margin-left:8px;flex:0 0 auto}
.r-act{display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;min-width:34px;height:28px;border:none;background:var(--input-bg);border-radius:8px;cursor:pointer;color:#37433c;font-size:12px;font-weight:700;line-height:1;transition:.15s;box-shadow:none}
.r-act:hover{background:rgba(43,182,115,.18);color:#1f7a4d}
.r-act.danger{color:#c0392b}
.r-act.danger:hover{background:rgba(224,90,77,.18);color:#c0392b}

.er-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.er-name{flex:1;font-weight:600;font-size:14px}
.er-pts{width:88px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:15px;text-align:center}
.stat-list{max-height:60vh;overflow:auto;margin:6px 0 4px}
.stat-row{background:var(--input-bg);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.stat-name{font-weight:700;font-size:14px;margin-bottom:6px}
.stat-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.stat-grid span{color:var(--muted)}
.stat-grid b{text-align:right;font-weight:700}
.btn-file{display:inline-flex;align-items:center;cursor:pointer}
.room-code{font-size:34px;font-weight:900;letter-spacing:7px;text-align:center;color:var(--accent);margin:4px 0 2px;font-family:ui-monospace,Menlo,Consolas,monospace}
.room-qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.room-qr svg{display:block}
.room-hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}

.mb-box{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mb-title{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.mb-hint-inline{font-size:11px;font-weight:500;color:var(--muted)}
.mb-row{display:flex;align-items:center;gap:6px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.mb-row:first-of-type{border-top:0}
.mb-row.banned{opacity:.7}
.mb-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mb-dot.on{background:#22c55e}
.mb-dot.off{background:var(--muted);opacity:.45}
.mb-name{font-weight:700;max-width:8.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--muted);flex:0 0 auto}
.mb-tag.owner{color:#a5701a;background:rgba(245,180,60,.2)}
.mb-tag.me{color:var(--accent-2);background:rgba(43,182,115,.16)}
.mb-tag.guest{color:var(--danger);background:rgba(224,90,77,.14)}
.mb-spacer{flex:1}
.mb-kick,.mb-unban{font-size:12px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);min-height:auto;flex:0 0 auto}
.mb-kick{color:var(--danger);border-color:rgba(224,90,77,.4)}
.mb-kick[data-sure="1"]{background:var(--danger);color:#fff;border-color:var(--danger)}
.mb-banned-title{font-size:12px;color:var(--muted);margin:8px 0 0;border-top:1px dashed var(--line);padding-top:8px}
.mb-nick{display:flex;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.mb-nick input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:13px}
.mb-nick button{flex:0 0 auto;padding:8px 14px;font-size:13px;min-height:auto}
.room-lead{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0 0 16px}
.room-lead b{color:var(--text)}
.room-input{width:100%;text-align:center;font-size:24px;letter-spacing:7px;font-weight:800;text-transform:uppercase;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--input-bg);color:var(--text);box-sizing:border-box}
.room-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(43,182,115,.12);color:#1f7a4d}
:root[data-theme="dark"] .room-status{background:rgba(43,182,115,.2);color:#6ee7a8}
.room-status.off{background:rgba(224,90,77,.12);color:var(--danger)}
.room-link{font-size:11px;color:var(--muted);word-break:break-all;text-align:center;margin-top:8px;line-height:1.5}
.room-or{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:var(--muted);font-size:13px}
.room-or:before,.room-or:after{content:"";flex:1;height:1px;background:var(--line)}
/* ===== v0.6.0.1 新功能样式 ===== */
.lang-toggle{display:inline-flex;align-items:center;gap:6px}
.voice-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.voice-row input[type=range]{flex:1;accent-color:var(--accent)}
.seg.mini-seg button{padding:6px 14px;font-size:13px}
.cl-scroll{max-height:58vh;overflow:auto;margin:8px 0 12px}
.cl-block{border-bottom:1px solid var(--line);padding:11px 0}
.cl-block:last-child{border-bottom:none}
.cl-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.cl-v{font-weight:800;color:var(--accent);font-size:15px}
.cl-date{color:var(--muted);font-size:12px}
.cl-items{margin:0;padding-left:18px}
.cl-items li{margin:3px 0;font-size:14px;line-height:1.5}
</style>

    "卡波说明书 · ": "Cabo manual · ",
    "</div> <div class=\"rules-caption\">点击图片进入大图模式，可上下滚动；点「放大」或双击可放大到 4 倍查看小字。若仍模糊，建议参考下方文字版规则。</div> <div class=\"rf-sec\">文字版规则</div> <div class=\"rf-card\"> <div class=\"rf-h\">🎯 游戏目标</div> 卡波（CABO）中<b>分数越低越有利</b>。每一局结束后把本局手牌分累加到总分，率先有人达到「结束分数线」时全局结束，按总分排名（默认<b>低分胜</b>）。 </div> <div class=\"rf-card\"> <div class=\"rf-h\">🃏 牌值</div> A=1，2~10 按面值，J=11，Q=12，K（黑）=13，K（红）=-1（视具体牌组约定）。牌越小越好。 </div> <div class=\"rf-card\"> <div class=\"rf-h\">🗣 呼唤 CABO</div> 轮到自己且未摸牌时可喊 CABO 结束本局，其余玩家各再行动一轮后摊牌。 <ol> <li>喊 CABO 者<b>手牌分全场最低</b> → 本局记 <b>0 分</b>。</li> <li>喊 CABO 者与他人<b>并列最低（平局）</b> → 仍算<b>喊话者获胜</b>，本局记 <b>0 分</b>。</li> <li>喊 CABO 者<b>不是最低</b> → 本局按手牌分计算，并<b>额外 +惩罚分</b>（默认 +10，可在设置改为 +5）。</li> </ol> </div> <div class=\"rf-card\"> <div class=\"rf-h\">🚀 神风特攻队（至尊组合）</div> 手中凑齐 <b>两张 13 + 两张 12</b> 的至尊组合即达成神风特攻队：<b>达成者本局记 0 分，其余玩家本局各 +50 分</b>。 <div class=\"rf-note\">官方触发前提：呼唤 CABO 之后，牌桌上出现「2 张 13 + 2 张 12」且再无其他牌时触发。计分时在本局面板点「🚀 神风特攻队」标记达成者即可。</div> </div> <div class=\"rf-card\"> <div class=\"rf-h\">💯 得分满减</div> 玩家总积分<b>恰好等于 100 分</b>时触发，该玩家总分<b>重置为 50 分</b>。 <ol> <li>只有<b>恰好 100</b> 才触发；<b>超过 100</b>（如 103、120）<b>不触发</b>。</li> <li>每个玩家整局游戏<b>各自可触发 1 次</b>（不是全场只有一次）。</li> <li>优先级：<b>先做满减，再判定游戏是否结束</b>。</li> </ol> </div> <div class=\"rf-card\"> <div class=\"rf-h\">🧮 多规则叠加结算顺序</div> 同一局同时触发多条规则时，严格按以下顺序结算： <ol> <li><b>神风特攻队</b>：达成者本局 0 分，其余玩家各 +50。</li> <li><b>CABO 喊话结算</b>：判定喊话者成功（0 分）或失败（+惩罚分）。</li> <li><b>总分累加</b>：把本局得分加到各玩家总分上。</li> <li><b>得分满减校验</b>：任一玩家总分恰好 100 → 重置为 50。</li> <li><b>游戏结束判定</b>：是否有人达到结束分数线。</li> </ol> <div class=\"rf-note\">因此神风给他人的 +50 累加后若<b>恰好等于 100</b>，同样会触发满减降到 50。若同一玩家<b>同时达成神风 + 喊 CABO 成功</b>，两者不冲突，本局最终仍是 <b>0 分</b>。</div> </div> <div class=\"rf-card\"> <div class=\"rf-h\">🎮 结束与胜负</div> 有玩家总分<b>达到或超过结束分数线</b>（默认 100，可改 150 / 200 / 250 或自定义）即触发结算，按当前总分排名。 <div class=\"rf-note\"><b>高分胜（娱乐模式）</b>：仅<b>反转排名方向</b>——总分最高者获胜。CABO 惩罚 +10/+5、神风特攻队 +50、得分满减（恰好 100→50）等规则<b>全部照常生效不变</b>。</div> </div> </div> </details>": "</div> <div class=\"rules-caption\">Tap the image to enter fullscreen, scroll up / down; tap \"Zoom\" or double-tap to enlarge up to 4x for small text. If still blurry, refer to the text rules below.</div> <div class=\"rf-sec\">Text rules</div> <div class=\"rf-card\"> <div class=\"rf-h\">🎯 Goal</div> In Cabo, <b>lower score is better</b>. After each round, add that round's hand score to the total. When someone first reaches the \"end score\", the game ends and ranks by total (default <b>lowest wins</b>). </div> <div class=\"rf-card\"> <div class=\"rf-h\">🃏 Card values</div> A=1, 2~10 face value, J=11, Q=12, K (black)=13, K (red)=-1 (per deck convention). Lower is better. </div> <div class=\"rf-card\"> <div class=\"rf-h\">🗣 Calling CABO</div> On your turn before drawing, you may call CABO to end the round; other players each take one more turn, then reveal. <ol> <li>CABO caller has <b>lowest hand</b> → scores <b>0 this round</b>.</li> <li>CABO caller ties for lowest → still counts as <b>caller wins</b>, scores <b>0</b>.</li> <li>CABO caller is <b>not lowest</b> → scored by hand value, plus <b>penalty</b> (default +10, changeable to +5 in settings).</li> </ol> </div> <div class=\"rf-card\"> <div class=\"rf-h\">🚀 Kamikaze squad (ultimate combo)</div> Holding the ultimate combo <b>two 13s + two 12s</b> triggers Kamikaze: <b>holder scores 0 this round, everyone else +50 each</b>. <div class=\"rf-note\">Official trigger: after calling CABO, when the table shows \"2×13 + 2×12\" and nothing else. Mark the holder with \"🚀 Kamikaze\" in the round panel.</div> </div> <div class=\"rf-card\"> <div class=\"rf-h\">💯 Score bonus</div> When a player's total is <b>exactly 100</b>, it triggers and that total <b>resets to 50</b>. <ol> <li>Only <b>exactly 100</b> triggers; <b>over 100</b> (e.g. 103, 120) does <b>not</b>.</li> <li>Each player may trigger <b>once per game</b> (not once total).</li> <li>Priority: <b>apply bonus first, then check game end</b>.</li> </ol> </div> <div class=\"rf-card\"> <div class=\"rf-h\">🧮 Multi-rule settlement order</div> When several rules trigger same round, settle strictly in this order: <ol> <li><b>Kamikaze</b>: holder 0, others +50 each.</li> <li><b>CABO settlement</b>: caller success (0) or fail (+penalty).</li> <li><b>Total accumulation</b>: add round score to each player's total.</li> <li><b>Score-bonus check</b>: any total exactly 100 → reset to 50.</li> <li><b>Game-end check</b>: anyone reached end score?</li> </ol> <div class=\"rf-note\">So if Kamikaze's +50 to others lands on <b>exactly 100</b>, the bonus also triggers down to 50. If one player <b>achieves both Kamikaze + CABO success</b>, they don't conflict — still <b>0</b> this round.</div> </div> <div class=\"rf-card\"> <div class=\"rf-h\">🎮 End & win</div> When a player's total <b>reaches or exceeds the end score</b> (default 100, or 150 / 200 / 250 / custom), settlement triggers, ranked by current total. <div class=\"rf-note\"><b>Highest wins (fun mode)</b>: only <b>reverses ranking direction</b> — highest total wins. CABO penalty +10/+5, Kamikaze +50, score bonus (exactly 100→50) all <b>still apply unchanged</b>.</div> </div> </div> </details>",

let voiceOn = false, voiceVol = 1;
function initVoice(){
  const v = (state && state.voice) || (state.voice = {on:false, volume:1, lang:null});
  voiceOn = !!v.on; voiceVol = (typeof v.volume==='number') ? v.volume : 1;
}
function speak(text){
  if(!voiceOn) return;
  if(typeof window === "undefined" || !('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (state.voice && state.voice.lang) || (state.lang==='en' ? 'en-US' : 'zh-CN');
    u.volume = voiceVol; u.rate = 1; u.pitch = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function voiceRound(pts){
  if(!voiceOn) return;
  const parts = state.players.map((p,i)=>{

    return (state.lang==='en') ? `${p.name} ${v>=0?'plus':'minus'} ${Math.abs(v)}` : `${p.name} ${v>=0?'加':'减'}${Math.abs(v)}${t(`分`)}`;
  });
  speak(parts.join(t('，')));
}

function exportExcel(){
  const ts = totals();
  const order = state.players.map((_,i)=>i).sort((a,b)=> state.winRule==="low" ? ts[a]-ts[b] : ts[b]-ts[a]);
  const aoa = [];
  aoa.push(["CABO " + (state.lang==='en'?'Score Export':'计分导出')]);
  aoa.push([(state.lang==='en'?'Generated':'导出时间'), new Date().toLocaleString()]);
  aoa.push([]);
  aoa.push([t("playerNames"), (state.lang==='en'?'Total':'总分'), (state.lang==='en'?'Rank':'排名')]);
  state.players.forEach((p,i)=> aoa.push([p.name, ts[i], order.indexOf(i)+1]));
  aoa.push([]);
  aoa.push([(state.lang==='en'?'Round':'局'), ...state.players.map(p=>p.name)]);
  const series = computeTotals().series;
  state.rounds.forEach((r,k)=>{
    const row = [k+1];
    state.players.forEach((_,i)=> row.push((r.pts&&r.pts[i])||0));
    aoa.push(row);
  });
  try{
    if(typeof XLSX === "undefined") throw new Error((state.lang==='en'?'Excel library not loaded, use JSON export':'Excel 组件未加载，请改用 JSON 导出'));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (state.lang==='en'?'Game':'对局'));
    XLSX.writeFile(wb, `CABO_${(state.lang==='en'?'game':'game')}_${Date.now()}.xlsx`);
    toast(t("exportExcel") + " ✓");
  }catch(e){ toast((state.lang==='en'?'Excel export failed: ':'导出 Excel 失败：') + e.message); }
}

function normalize(){
  if(!state.rules) state.rules = defaultState().rules;
  const d = defaultState().rules;
  if(typeof state.rules.caboPenalty !== "number") state.rules.caboPenalty = d.caboPenalty;
  if(state.rules.tieRule !== "callerWins" && state.rules.tieRule !== "bothZero") state.rules.tieRule = d.tieRule;
  // migrate old "zero" value to new "half"; accept only current valid values
  if(state.rules.hundredEgg === "zero") state.rules.hundredEgg = "half";
  if(!["off","half","none"].includes(state.rules.hundredEgg)) state.rules.hundredEgg = d.hundredEgg;
  if(state.rules.cardInput !== "cards" && state.rules.cardInput !== "total") state.rules.cardInput = "total";
  if(typeof state.rules.autoAdvance !== "boolean") state.rules.autoAdvance = true;
  if(!state.rules.lowBonus) state.rules.lowBonus = {enabled:true, amount:10};
  if(typeof state.rules.lowBonus.enabled !== "boolean") state.rules.lowBonus.enabled = true;
  if(typeof state.rules.lowBonus.amount !== "number") state.rules.lowBonus.amount = 10;
  if(!Array.isArray(state.adjust) || state.adjust.length !== state.players.length) state.adjust = state.players.map(()=>0);
  if(!Array.isArray(state.opLog)) state.opLog = [];
  if(typeof state.bonusApplied !== "boolean") state.bonusApplied = false;
  if(typeof state.archived !== "boolean") state.archived = false;
  // migrate old boolean hundredUsed to per-player array
  if(typeof state.hundredUsed === "boolean") state.hundredUsed = state.players.map(()=> state.hundredUsed);
  if(!Array.isArray(state.hundredUsed) || state.hundredUsed.length !== state.players.length) state.hundredUsed = state.players.map(()=>false);
  if(typeof state.sound !== "boolean") state.sound = true;
  if(typeof state.theme !== "string") state.theme = "light";
  if(typeof state.lang !== "string" || (state.lang!=="zh" && state.lang!=="en")) state.lang = (typeof navigator!=='undefined' && (navigator.language||'').toLowerCase().startsWith('en'))?'en':'zh';
  if(!state.voice || typeof state.voice!=="object") state.voice = {on:false, volume:1, lang:null};
  if(typeof state.voice.on !== "boolean") state.voice.on = false;
  if(typeof state.voice.volume !== "number") state.voice.volume = 1;
  if(!Array.isArray(state.rounds)) state.rounds = [];
  else {
    // 玩家索引合法性校验：人数变动时防止越界残留
    const pIdx = v => (typeof v === "number" && v >= 0 && v < state.players.length) ? v : null;
    state.rounds = state.rounds.map(r=>{
      if(r && typeof r === "object" && Array.isArray(r.pts)){
        const pts = state.players.map((_,i)=> (has(r.pts[i])?r.pts[i]:0) + (has(r.adj)?(has(r.adj[i])?r.adj[i]:0):0));
        // 必须保留 cabo / kami / cards，否则刷新后喊话与神风记录全部丢失、分数被重算
        const out = { pts, cabo: pIdx(r.cabo), kami: pIdx(r.kami) };
        if(Array.isArray(r.cards)) out.cards = state.players.map((_,i)=> Array.isArray(r.cards[i]) ? r.cards[i] : [0,0,0,0]);
        return out;
      }
      if(Array.isArray(r)) return { pts: state.players.map((_,i)=> has(r[i])?r[i]:0), cabo:null, kami:null };
      return { pts: state.players.map(()=>0), cabo:null, kami:null };
    });
  }
  /* 房间成员名单：members 由旧版「DEVICE_ID 字符串数组」升级为 [{id,name,login,at}]，向后兼容 */
  if(!state.lock || typeof state.lock !== "object") state.lock = {locked:false, loginOnly:false, owner:"", members:[], banned:[]};
  if(typeof state.lock.locked !== "boolean") state.lock.locked = false;
  if(typeof state.lock.loginOnly !== "boolean") state.lock.loginOnly = false;
  if(typeof state.lock.owner !== "string") state.lock.owner = "";
  if(!Array.isArray(state.lock.members)) state.lock.members = [];
  state.lock.members = state.lock.members.map(function(m){
    if(typeof m === "string") return {id:m, name:"", login:false, at:0};
    if(m && m.id) return {id:String(m.id), name:String(m.name||""), login:!!m.login, at:m.at||0};
    return null;
  }).filter(Boolean);
  if(!Array.isArray(state.lock.banned)) state.lock.banned = [];
  state.lock.banned = state.lock.banned.map(function(b){
    if(typeof b === "string") return {id:b, name:""};
    if(b && (b.id || b.name)) return {id:String(b.id||""), name:String(b.name||"")};
    return null;
  }).filter(Boolean);
  // 给每位玩家分配稳定的展示颜色（计分卡 / 历史 / 图表 / 战报统一使用）
  state.players.forEach((p,i)=>{ if(!p.color) p.color = PALETTE[i % PALETTE.length]; });
}

function computeTotals(){
  const n = state.players.length;
  const totals = state.players.map(()=>0);
  const series = [];
  const eggs = [];
  // 由 rounds 重新推导，避免重算时因 state.hundredUsed 已置 true 而丢失折扣；每个玩家独立计算一次
  const used = state.players.map(()=>false);
  state.rounds.forEach((r, ri)=>{
    const pts = state.players.map((_,i)=> (has(r.pts) && has(r.pts[i])) ? r.pts[i] : 0);
    let delta;
    if(has(r.kami)){
      delta = state.players.map((_,i)=> i===r.kami ? 0 : 50);
    } else if(has(r.cabo)){
      // Cabo 成败只看【本局手牌分】，与累计总分无关
      const pre = state.players.map((_,i)=> pts[i]||0);
      const minT = Math.min.apply(null, pre);
      const callerLow = pre[r.cabo] === minT;
      let zeroSet = [];
      if(callerLow){
        if(state.rules.tieRule === "bothZero")
          zeroSet = pre.map((v,i)=> v===minT ? i : -1).filter(i=> i>=0);
        else zeroSet = [r.cabo];
      }
      delta = state.players.map((_,i)=>{
        if(zeroSet.indexOf(i) >= 0) return 0;
        if(i === r.cabo) return (pts[i]||0) + state.rules.caboPenalty;
        return pts[i]||0;
      });
    } else {
      delta = pts.slice();
    }
    for(let i=0;i<n;i++){
      totals[i] += delta[i];
      if(state.rules.hundredEgg === "half" && !used[i] && totals[i] === 100){
        totals[i] = 50; used[i] = true; eggs.push({round:ri, player:i});
      }
    }
    series.push(totals.slice());
  });
  return { totals, series, eggs, used };
}
function roundDelta(pts, cabo, kami){
  if(has(kami)) return state.players.map((_,i)=> i===kami ? 0 : 50);
  if(has(cabo)){
    const pre = state.players.map((_,i)=> pts[i]||0);
    const minT = Math.min.apply(null, pre);
    const callerLow = pre[cabo] === minT;
    let zeroSet = [];
    if(callerLow){
      if(state.rules.tieRule === "bothZero")
        zeroSet = pre.map((v,i)=> v===minT ? i : -1).filter(i=> i>=0);
      else zeroSet = [cabo];
    }
    return state.players.map((_,i)=>{
      if(zeroSet.indexOf(i) >= 0) return 0;
      if(i === cabo) return (pts[i]||0) + state.rules.caboPenalty;
      return pts[i]||0;
    });
  }
  return pts.slice();
}
function totals(){ const {totals:t} = computeTotals(); return t.map((v,i)=> v + (state.adjust[i]||0)); }

function syncCount(n){

  while(state.players.length > n){ state.players.pop(); state.hundredUsed.pop(); state.adjust.pop(); }
  if(!Array.isArray(state.adjust) || state.adjust.length !== state.players.length) state.adjust = state.players.map(()=>0);
  if(!Array.isArray(state.hundredUsed) || state.hundredUsed.length !== state.players.length) state.hundredUsed = state.players.map(()=>false);
}

/* 图片灯箱：支持多图翻页、上下滚动、放大到 2.2 倍（解决手机端看不清小字） */
function openLightbox(arg){
  const list = RULE_IMAGES;
  let i = 0;
  if(typeof arg === "number") i = Math.max(0, Math.min(list.length-1, arg));
  else if(typeof arg === "string"){ const f = list.findIndex(x=> x.src === arg); i = f >= 0 ? f : 0; }

  const lb = document.createElement("div"); lb.className = "lightbox";
  lb.innerHTML = t(`<div class="lb-bar"> <div class="lb-title" id="lbTitle"></div> <div class="lb-btns"> <button id="lbPrev">‹</button> <button id="lbZoom">🔍 放大</button> <button id="lbNext">›</button> <button id="lbClose">✕</button> </div> </div> <div class="lb-stage"><img id="lbImg" alt="规则大图"></div> <div class="lb-tip">上下滑动查看 · 双击图片切换放大</div>`);
  document.body.appendChild(lb);
  document.body.style.overflow = "hidden";

  const imgEl = lb.querySelector("#lbImg");
  const titleEl = lb.querySelector("#lbTitle");
  const zoomBtn = lb.querySelector("#lbZoom");
  const show = ()=>{
    imgEl.src = list[i].src;
    titleEl.textContent = list[i].title + `${t(`（`)}${i+1}/${list.length}${t(`）`)}`;
    lb.scrollTop = 0; lb.scrollLeft = 0;
  };
  const toggleZoom = ()=>{
    const on = lb.classList.toggle("zoom");
    zoomBtn.textContent = on ? "🔍 缩小" : "🔍 放大";
    if(on) lb.scrollLeft = (lb.scrollWidth - lb.clientWidth) / 2;
  };
  const close = ()=>{ lb.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); };
  const onKey = (e)=>{
    if(e.key === "Escape") close();
    else if(e.key === "ArrowRight"){ i = (i+1) % list.length; show(); }
    else if(e.key === "ArrowLeft"){ i = (i-1+list.length) % list.length; show(); }
  };
  lb.querySelector("#lbClose").onclick = close;
  lb.querySelector("#lbPrev").onclick = ()=>{ i = (i-1+list.length) % list.length; show(); };
  lb.querySelector("#lbNext").onclick = ()=>{ i = (i+1) % list.length; show(); };
  zoomBtn.onclick = toggleZoom;
  imgEl.ondblclick = toggleZoom;
  imgEl.onerror = ()=>{ titleEl.textContent = t("图片未能加载，请查看文字版规则"); };
  lb.addEventListener("click", (e)=>{ if(e.target === lb || e.target.className === "lb-stage") close(); });
  document.addEventListener("keydown", onKey);
  show();
}

/* ---------- effects ---------- */
function launchConfetti(ms){
  ms = ms || 3400;
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80";
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  const resize = ()=>{ c.width = innerWidth; c.height = innerHeight; };
  resize(); addEventListener("resize", resize);
  const colors = ["#2e7d52","#ffd54f","#ef5350","#42a5f5","#ab47bc","#ffa726","#26c6da"];
  const N = 150, ps = [];
  for(let i=0;i<N;i++) ps.push({
    x:Math.random()*c.width, y:Math.random()*-c.height - 20,
    r:5+Math.random()*7, col:colors[i%colors.length],
    vy:2.4+Math.random()*3.4, vx:-1.4+Math.random()*2.8,
    a:Math.random()*Math.PI, va:0.08+Math.random()*0.22
  });
  const t0 = performance.now();
  function frame(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of ps){
      p.y += p.vy; p.x += p.vx; p.a += p.va;
      if(p.y > c.height+12){ p.y = -12; p.x = Math.random()*c.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6); ctx.restore();
    }
    if(t - t0 < ms) requestAnimationFrame(frame);
    else { c.remove(); removeEventListener("resize", resize); }
  }
  requestAnimationFrame(frame);
}
function showEventBanner(e){
  const b = document.createElement("div");
  let cls = "event-banner", html = "";
  if(e.type === "egg"){
    html = `${t(`<div class="eb-emoji">💯</div><div class="eb-title">得分满减！</div><div class="eb-sub">`)}${escapeHtml(e.name)}${t(`恰好 100 分 → 重置为 50！</div>`)}`;

/* ---------- local sound effects (Web Audio, no files, no network) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, t0, dur, type, peak){
  const ctx = audioCtx; const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak || 0.25, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function playDing(){
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  tone(988, t, 0.5, "sine", 0.32);
  tone(1318.5, t, 0.65, "sine", 0.18);
}
function playWhoosh(){
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime, dur = 0.65;
  const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = Math.random()*2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const filt = ctx.createBiquadFilter(); filt.type = "bandpass"; filt.Q.value = 0.7;
  filt.frequency.setValueAtTime(300, t);
  filt.frequency.exponentialRampToValueAtTime(2400, t + dur*0.5);
  filt.frequency.exponentialRampToValueAtTime(380, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.38, t + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt); filt.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t + dur);
}
function playCheer(){
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((f,i)=> tone(f, t + i*0.12, 0.42, "triangle", 0.22));
  tone(1568, t + 0.5, 0.55, "sine", 0.12);
}
function playFail(){
  if(!state.sound) return; const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  tone(180, t, 0.18, "sawtooth", 0.18);
  tone(150, t + 0.16, 0.22, "sawtooth", 0.22);
  tone(110, t + 0.34, 0.45, "sawtooth", 0.28);
}

/* ---------- named saves ---------- */
const SAVE_KEY = "cabo-saves-v2";
function deep(o){ return JSON.parse(JSON.stringify(o)); }
function fmtTime(ts){
  const d = new Date(ts), p = n => (n<10?"0":"")+n;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function loadSaves(){
  try{ const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : []; }catch(e){ return []; }
}
function saveSaves(list){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(list)); }catch(e){} }
/* 自动存档置顶：始终排在最前，其余按时间倒序 */
function pinnedSaves(list){ return list.filter(s=> s.auto).concat(list.filter(s=> !s.auto)); }
function autoArchive(){
  const list = loadSaves();
  const name = t("对局 ") + fmtTime(Date.now());
  list.unshift({
    id: Date.now()*1000 + Math.floor(Math.random()*1000),
    name, time: Date.now(), auto:true,
    players: state.players.map(p=>({name:p.name})),
    rounds: deep(state.rounds),
    adjust: state.adjust.slice(),
    bonusApplied: state.bonusApplied,
    hundredUsed: (state.hundredUsed||[]).slice(),
    endScore: state.endScore, winRule: state.winRule, rules: deep(state.rules)
  });
  saveSaves(list);
}
/* 自动存档：每次提交/修改后把当前对局写进「我的存档」的固定槽位，可随时载入继续 */
const AUTOSAVE_ID = "__autosave__";
function autoSaveOn(){ try{ return localStorage.getItem("cabo-autosave-on") !== "0"; }catch(e){ return true; } }
function setAutoSaveOn(v){ try{ localStorage.setItem("cabo-autosave-on", v?"1":"0"); }catch(e){} }
function refreshAutoBtn(){
  const b = document.querySelector("#autoSaveBtn");
  if(!b) return;
  const on = autoSaveOn();
  b.textContent = on ? "💾" : "💤";
  b.title = t("自动存档：") + (on ? "开（点此关闭）" : "关（点此开启）");
  b.classList.toggle("off", !on);
}
// 4 张小框：输完自动跳到下一格（设置里可关）。事件委托，覆盖动态生成的录入框
document.addEventListener("input", function(e){
  var t = e.target;
  if(!t || !t.classList) return;
  if(t.classList.contains("c4") || t.classList.contains("er-c4i")){
    if(!state.rules.autoAdvance) return;
    var v = (t.value || "");
    if(v.length >= 2 || (v.length === 1 && v !== "1")){
      var all = Array.prototype.slice.call(document.querySelectorAll(".c4, .er-c4i"));
      var idx = all.indexOf(t);
      if(idx >= 0 && idx + 1 < all.length) all[idx + 1].focus();
    }
  }
});
function clearAutoSave(){

}

function computeSavedTotals(s){
  const st = { players:s.players, rounds:s.rounds, adjust:s.adjust||s.players.map(()=>0), rules:s.rules,
    hundredUsed: Array.isArray(s.hundredUsed) ? s.hundredUsed.slice() : s.players.map(()=> !!s.hundredUsed) };
  // reuse computeTotals logic via a temp assignment
  const savedState = state;
  state = st;
  const {totals} = computeTotals();
  state = savedState;
  return totals.map((t,i)=> t + ((s.adjust&&s.adjust[i])||0));
}
function loadSave(id){
  const s = loadSaves().find(x=> String(x.id) === String(id));
  if(!s) return;
  state.players = s.players.map(p=>({name:p.name}));
  state.rounds = deep(s.rounds);
  state.adjust = (s.adjust||state.players.map(()=>0)).slice();
  state.bonusApplied = !!s.bonusApplied;
  state.hundredUsed = Array.isArray(s.hundredUsed) ? s.hundredUsed.slice() : state.players.map(()=> !!s.hundredUsed);
  state.endScore = s.endScore;
  state.winRule = s.winRule;
  state.rules = deep(s.rules);
  state.started = true;
  state.archived = false;
  save(); render();
  toast(t("已载入：") + s.name);
}

function historyHtml(){
  const {series, eggs} = computeTotals();
  if(state.rounds.length===0) return t('<div style="color:var(--muted);font-size:14px">还没有提交过局数</div>');
  let html = "";
  state.rounds.forEach((r,k)=>{
    const prev = k===0 ? state.players.map(()=>0) : series[k-1];
    const cur = series[k];
    const delta = state.players.map((_,i)=> cur[i]-prev[i]);
    const isK = has(r.kami);
    const isC = has(r.cabo);
    const rnHtml = isK
      ? `${t(`<span class="rn">第`)}${k+1}${t(`局</span><span class="rn-kami">🚀 神风特攻队</span>`)}`
      : `${t(`<span class="rn">第`)}${k+1}${t(`局</span>`)}`;
    const tools = `<span class="r-tools"><button class="r-act" data-edit="${k}${t(`" title="修改本局">修改</button><button class="r-act danger" data-del="`)}${k}${t(`" title="删除本局">删除</button></span>`)}`;
    const rawPts = state.players.map((_,i)=> (has(r.pts)&&has(r.pts[i])) ? r.pts[i] : 0);
    const roundEggs = eggs.filter(e=> e.round===k).map(e=> e.player);
    const parts = state.players.map((p,i)=>{
      const d = delta[i];
      const cardTxt = (has(r.cards)&&has(r.cards[i])) ? `<span class="cards-mini">${r.cards[i].join('·')}</span>` : '';
      return `<span class="pname" style="color:${p.color}">${escapeHtml(p.name)}</span><span class="d ${d<0?'neg':''}">${d>=0?'+':''}${d}</span>${cardTxt}`;
    }).join(" ");
    let tag = "";
    if(isK){
      tag = `${t(`<div class="r-tag kami">🚀 神风特攻队：`)}${escapeHtml(state.players[r.kami].name)}${t(`本局 0 分 · 其余各 +50</div>`)}`;
      if(isC) tag += `<div class="r-tag cabo ${r.cabo===r.kami?'ok':''}${t(`">🗣 本局`)}${escapeHtml(state.players[r.cabo].name)}${t(`也喊了 Cabo`)}${r.cabo===r.kami?'（与神风不冲突，本局 0 分）':'（按神风结算 +50）'}</div>`;
    }
    else if(isC){
      // Cabo 成败只看【本局手牌分】
      const preTotal = rawPts.slice();
      const minT = Math.min.apply(null, preTotal);
      const callerLow = preTotal[r.cabo] === minT;
      tag = callerLow
        ? `${t(`<div class="r-tag cabo ok">🗣 Cabo：`)}${escapeHtml(state.players[r.cabo].name)}${t(`全场最低 → 本局 0 分</div>`)}`
        : `${t(`<div class="r-tag cabo fail">🗣 Cabo：`)}${escapeHtml(state.players[r.cabo].name)}${(state.lang==='en') ? ('Below min → +'+delta[r.cabo]+' pts (cards '+(rawPts[r.cabo]||0)+' + penalty '+state.rules.caboPenalty+')') : ('未达最低 → 本局 +'+delta[r.cabo]+' 分（手牌 '+(rawPts[r.cabo]||0)+' + 惩罚 '+state.rules.caboPenalty+'）')}${t(`</div>`)}`;
    }
    const ruleLine = isK
      ? `${t(`<div class="r-rule kami">规则：神风特攻队持有者`)}${escapeHtml(state.players[r.kami].name)}${t(`本局 0 分，其余玩家各 +50 分</div>`)}`
      : (isC ? tag : '');
    const eggHtml = eggs.filter(e=> e.round===k).map(e=>
      `${t(`<div class="r-event ev-hundred"><span class="ev-emoji">💯</span><span><b>得分满减！</b>`)}${escapeHtml(state.players[e.player].name)}${t(`本局前总分 100 → 重置为 50</span></div>`)}`
    ).join("");
    html += `<div class="r ${isK?'r-kamikaze':''}"><div class="r-head">${rnHtml}<span class="parts">${parts}</span>${tools}</div>${ruleLine}${eggHtml}</div>`;
  });

function commitRound(){
  const pts = state.players.map((_,i)=>{
    if(state.rules.cardInput==='cards'){
      const vals = [0,1,2,3].map(j=> parseFloat(document.getElementById("c"+i+"-"+j).value)||0);
      return vals.reduce((a,b)=> a+b, 0);
    }
    return parseFloat(document.getElementById("pts-"+i).value)||0;
  });
  if(pts.every(p=> p===0) && roundCabo==null && roundKami==null){ toast(t("本局全是 0，确认要提交？")); }
  const r = { pts, cabo: roundCabo, kami: roundKami };
  if(state.rules.cardInput==='cards'){
    r.cards = state.players.map((_,i)=> [0,1,2,3].map(j=> parseFloat(document.getElementById("c"+i+"-"+j).value)||0));
  }
  state.rounds.push(r);
  const events = [];
  if(has(roundKami)) events.push({type:"kamikaze", name: state.players[roundKami].name});
  const delta = roundDelta(pts, roundCabo, roundKami);
  if(has(roundCabo)){
    // Cabo 成败只看【本局手牌分】
    const preTotal = state.players.map((_,i)=> pts[i]||0);
    const minT = Math.min.apply(null, preTotal);
    const callerLow = preTotal[roundCabo] === minT;
    events.push({type:"cabo", name: state.players[roundCabo].name, success: callerLow, card: pts[roundCabo]||0, penalty: state.rules.caboPenalty, result: delta[roundCabo]});
  }
  const {eggs} = computeTotals();
  eggs.filter(e=> e.round===state.rounds.length-1).forEach(e=> events.push({type:"egg", name: state.players[e.player].name}));
  save();
  autoSaveSnapshot();
  events.forEach((e,idx)=> setTimeout(()=> showEventBanner(e), idx*2700));
  render();
  if(has(roundCabo)) voiceCabo(state.players[roundCabo].name);
  voiceRound(delta);
  toast(t("✅ 已自动保存"));
}

function undoRounds(n){

  state.rounds.splice(state.rounds.length - n, n);
  save(); autoSaveSnapshot(); render(); toast(t("已撤销最近 ") + n + t(" 局"));
  pushOpLog(t("撤销最近 ") + n + t(" 局"));

function showGameOver(ts, reachedIdx){
  if(!state.archived){
    autoArchive();
    state.archived = true;
    save();
  }
  let order = state.players.map((_,i)=>i).sort((a,b)=> state.winRule==="low" ? ts[a]-ts[b] : ts[b]-ts[a]);
  let winIdx = order[0];
  let bonusTxt = "";
  if(state.rules.lowBonus.enabled && !state.bonusApplied){
    const amt = state.rules.lowBonus.amount || 0;
    if(amt > 0){
      state.adjust[winIdx] = (state.adjust[winIdx]||0) - amt;
      state.bonusApplied = true;
      ts = totals();
      bonusTxt = `${t(`（险胜嘉奖 -`)}${amt}${t(`）`)}`;
      order = state.players.map((_,i)=>i).sort((a,b)=> state.winRule==="low" ? ts[a]-ts[b] : ts[b]-ts[a]);
      winIdx = order[0];
    }
  }

async function exportReportImage(reportText){
  if(typeof reportText !== "string") reportText = String(reportText || "");
  const cv = document.querySelector("#reportCanvas");
  if(!cv){ toast(t("未找到绘图区域")); return; }
  const ctx = cv.getContext("2d");
  const W = 400, H = 720;
  const S = 2;
  cv.width = W * S; cv.height = H * S;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.scale(S, S);
  ctx.clearRect(0,0,W,H);

  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}

  const lines = reportText.split("\n");
  const meta = {};
  const ranks = [];
  const events = [];
  let winner = "";
  lines.forEach(ln=>{
    const t = ln.trim();
    if(t.startsWith(t("对局："))) meta.name = t.slice(3);
    else if(t.startsWith(t("对局时间："))) meta.time = t.slice(5);
    else if(t.startsWith(t("玩家人数："))) meta.players = t;
    else if(t.startsWith(t("规则："))) meta.rule = t.slice(3);
    else if(t.startsWith(t("总轮数："))) meta.rounds = t;
    else if(/^\d+\.\s+(.+?)\s+[\u2014\u2013-]\s+(\d+)\s*分$/.test(t)){
      const m = t.match(/^(\d+)\.\s+(.+?)\s+[\u2014\u2013-]\s+(\d+)\s*分$/);
      ranks.push({pos:+m[1], name:m[2].trim(), score:+m[3]});
    }
    else if(t.startsWith(t("🎉 获胜："))) winner = t.slice(5);
    else if(t.startsWith(t("神风特攻队：")) || t.startsWith(t("CABO 喊话：")) || t.startsWith(t("得分满减："))) events.push(t);
  });

  const ff = "PingFang SC,Microsoft YaHei,Helvetica Neue,Arial,sans-serif";
  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
    if(fill){ ctx.fillStyle = fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle = stroke[0]; ctx.lineWidth = stroke[1]; ctx.stroke(); }
  }
  function shadow(blur, color, offX=0, offY=0){
    ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = offX; ctx.shadowOffsetY = offY;
  }
  function noShadow(){ ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; }
  function drawText(str, x, y, size, color, weight="normal", align="left"){
    ctx.textAlign = align; ctx.font = `${weight} ${size}px ${ff}`; ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function fitText(str, maxW, size){
    ctx.font = `700 ${size}px ${ff}`;
    let w = ctx.measureText(str).width;
    if(w <= maxW) return str;
    let s = str;
    while(s.length > 1 && ctx.measureText(s + "…").width > maxW){ s = s.slice(0,-1); }
    return s + "…";
  }

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#070f1e"); bg.addColorStop(.45,"#0f1f3a"); bg.addColorStop(1,"#1b3a5c");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const starSeed = [0.12,0.85,0.33,0.67,0.21,0.91,0.05,0.44,0.78,0.29,0.63,0.17,0.52,0.88,0.39,0.74,0.11,0.56,0.95,0.48,0.81,0.36,0.69,0.02,0.59,0.27,0.42,0.99,0.14,0.61];
  starSeed.forEach((s,i)=>{
    const x = ((s*930) % W);
    const y = ((Math.sin(i*2.7)*0.5+0.5)*H*0.55) + 10;
    const a = 0.25 + 0.7*((i*13)%10)/10;
    const r = (i%4===0) ? 1.6 : 0.9;
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  });

  noShadow();
  ctx.fillStyle = "rgba(255,251,230,.18)"; ctx.beginPath(); ctx.arc(W-62,66,46,0,7); ctx.fill();
  ctx.fillStyle = "rgba(255,248,220,.35)"; ctx.beginPath(); ctx.arc(W-62,66,38,0,7); ctx.fill();
  ctx.fillStyle = "#fffbe6"; ctx.beginPath(); ctx.arc(W-62,66,30,0,7); ctx.fill();
  ctx.fillStyle = "rgba(180,170,140,.25)"; ctx.beginPath(); ctx.arc(W-70,58,5,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(W-52,74,3.5,0,7); ctx.fill();

  ctx.fillStyle = "#051020";
  ctx.beginPath(); ctx.moveTo(0,H-24); ctx.lineTo(0,H-78); ctx.quadraticCurveTo(35,H-98,75,H-68); ctx.lineTo(110,H-92); ctx.lineTo(155,H-62); ctx.quadraticCurveTo(210,H-40,270,H-66); ctx.lineTo(330,H-50); ctx.quadraticCurveTo(370,H-72,400,H-60); ctx.lineTo(W,H-82); ctx.lineTo(W,H-24); ctx.closePath(); ctx.fill();

  const cardColors = ["#e74c3c","#f1c40f","#3498db","#9b59b6","#2ecc71"];
  [
    {x:32,y:H-28,r:-0.25,c:0},{x:88,y:H-22,r:0.18,c:1},{x:148,y:H-30,r:-0.12,c:2},
    {x:214,y:H-20,r:0.22,c:3},{x:278,y:H-28,r:-0.16,c:4},{x:338,y:H-22,r:0.14,c:0}
  ].forEach(d=>{
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.r);
    roundRect(-13,-18,26,36,3,cardColors[d.c],["rgba(255,255,255,.18)",1]);
    ctx.restore();
  });

  const px=22, py=36, pw=W-px*2, ph=H-py*2-52;
  shadow(32,"rgba(0,0,0,.55)",0,8);
  roundRect(px,py,pw,ph,20,"rgba(16,32,56,.94)",["rgba(218,195,140,.6)",2.5]);
  noShadow();
  roundRect(px+9,py+9,pw-18,ph-18,15,null,["rgba(218,195,140,.16)",1]);

  const orn=(x,y,rot)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.strokeStyle="rgba(218,195,140,.6)"; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(-10,0); ctx.quadraticCurveTo(0,0,0,-10); ctx.stroke(); ctx.restore(); };
  orn(px+14,py+14,0); orn(px+pw-14,py+14,Math.PI/2); orn(px+pw-14,py+ph-14,Math.PI); orn(px+14,py+ph-14,-Math.PI/2);

  drawText(t("CABO 胜利结算"), W/2, py+52, 32, "#fff", "800", "center");
  drawText(t("本轮") + (meta.rule && meta.rule.includes(t("高分")) ? "最高分" : "最低分") + t("玩家获胜"), W/2, py+80, 14, "rgba(255,255,255,.75)", "500", "center");

  const n = ranks.length || 1;
  const gap = n<=3 ? 14 : 10;
  const cardW = Math.min(90, (pw-24-gap*(n-1))/n);
  const startX = W/2 - (n*cardW + gap*(n-1))/2;
  const cy0 = py+104;
  ranks.forEach((r,i)=>{
    const x=startX+i*(cardW+gap), y=cy0;
    const gold = i===0;
    shadow(14,"rgba(0,0,0,.4)",0,5);
    roundRect(x,y,cardW,108,14, gold?"rgba(46,62,90,.98)":"rgba(28,48,80,.98)", [gold?"rgba(255,215,0,.85)":"rgba(200,180,130,.5)", 2]);
    noShadow();
    ctx.fillStyle = gold?"rgba(255,215,0,.08)":"rgba(255,255,255,.04)";
    ctx.beginPath(); ctx.moveTo(x,y+14); ctx.quadraticCurveTo(x+cardW/2,y+4,x+cardW,y+14); ctx.lineTo(x+cardW,y+50); ctx.quadraticCurveTo(x+cardW/2,y+40,x,y+50); ctx.closePath(); ctx.fill();
    ctx.fillStyle = gold?"#ffd700":"rgba(180,200,230,.85)"; ctx.beginPath(); ctx.arc(x+cardW/2,y+20,13,0,7); ctx.fill();
    drawText(String(r.pos), x+cardW/2, y+25, 14, gold?"#4a3b00":"#0a1628", "800", "center");
    drawText(fitText(r.name, cardW-12, 13), x+cardW/2, y+52, 13, "#fff", "700", "center");
    drawText(String(r.score), x+cardW/2, y+84, 28, gold?"#ffd700":"#fff", "800", "center");
    drawText(t("分"), x+cardW/2, y+100, 11, "rgba(255,255,255,.55)", "500", "center");
  });

  let y = cy0 + 124;
  ctx.strokeStyle = "rgba(218,195,140,.22)"; ctx.beginPath(); ctx.moveTo(px+24,y); ctx.lineTo(px+pw-24,y); ctx.stroke();
  y += 24;
  const metaParts = [];
  if(meta.time) metaParts.push(meta.time);
  if(meta.rule) metaParts.push(meta.rule);
  if(meta.rounds) metaParts.push(meta.rounds);
  if(metaParts.length){ drawText(metaParts.join(" · "), W/2, y, 12, "rgba(255,255,255,.6)", "400", "center"); y+=22; }

  if(events.length){

    drawText(t("规则战报："), px+26, y, 16, "#ffd699", "700"); y+=24;
    events.forEach(ev=>{
      const idx = ev.indexOf(t("："));
      const label = idx>=0 ? ev.slice(0,idx+1) : ev;

  const by = py+ph-44;
  function drawButton(label, cx, w){

    noShadow();
    ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.beginPath(); ctx.moveTo(x,y+8); ctx.quadraticCurveTo(cx,y,x+w,y+8); ctx.lineTo(x+w,y+12); ctx.quadraticCurveTo(cx,y+4,x,y+12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(218,195,140,.7)"; ctx.beginPath(); ctx.moveTo(x+10,y+h/2); ctx.lineTo(x+16,y+h/2-4); ctx.lineTo(x+22,y+h/2); ctx.lineTo(x+16,y+h/2+4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+w-10,y+h/2); ctx.lineTo(x+w-16,y+h/2-4); ctx.lineTo(x+w-22,y+h/2); ctx.lineTo(x+w-16,y+h/2+4); ctx.closePath(); ctx.fill();
    drawText(label, cx, y+20, 13, "#fff", "600", "center");
  }
  drawButton(t("复制战报"), W/2-86, 130);
  drawButton(t("再来一局"), W/2+86, 130);

  drawText("Cabo Scorer v0.6.0", W/2, H-16, 11, "rgba(255,255,255,.45)", "400", "center");

  try{
    const fname = t("卡波战报_") + fmtTime(Date.now()).replace(/[:\s]/g,"-") + ".png";
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const finish = (url, blobUrl)=>{
      const img = document.querySelector("#reportImg");
      if(img){ img.src = url; img.classList.remove("hidden"); }

      if(blobUrl) setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 5000);
    };
    if(cv.toBlob){
      cv.toBlob((blob)=>{

        finish(URL.createObjectURL(blob), true);
      }, "image/png");

    }
  }catch(e){

  }
}

/* ---------- chart ---------- */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function drawChart(){
  const cv = document.querySelector("#chart");
  if(!cv) return;
  const {series} = computeTotals();
  const data = [state.players.map(()=>0)].concat(series);
  const W = cv.width = cv.clientWidth || 520;
  const H = cv.height = 240;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const pad = {l:34,r:10,t:14,b:24};
  const rounds = data.length;
  let maxV = 10;
  data.forEach(row=> row.forEach(v=>{ if(v>maxV) maxV=v; }));
  ctx.strokeStyle = cssVar("--line") || "#ddd"; ctx.lineWidth = 1;
  ctx.fillStyle = cssVar("--muted") || "#888"; ctx.font = "11px sans-serif";
  for(let g=0; g<=4; g++){
    const y = pad.t + (H-pad.t-pad.b)*g/4;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillText(String(Math.round(maxV*(4-g)/4)), 4, y+4);
  }
  const xAt = i => pad.l + (W-pad.l-pad.r) * (rounds<=1 ? 0 : i/(rounds-1));
  const yAt = v => pad.t + (H-pad.t-pad.b) * (1 - v/maxV);
  state.players.forEach((p,i)=>{
    const col = state.players[i].color || PALETTE[i%PALETTE.length];
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath();
    data.forEach((row,ri)=>{ const x=xAt(ri), y=yAt(row[i]); ri===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    data.forEach((row,ri)=>{ const x=xAt(ri), y=yAt(row[i]); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill(); });
  });
  ctx.fillStyle = cssVar("--muted") || "#888";
  for(let ri=0; ri<rounds; ri++){ const x=xAt(ri); ctx.fillText(ri===0?"0":("R"+ri), x-6, H-6); }
  const lg = document.querySelector("#chartLegend");
  if(lg) lg.innerHTML = state.players.map((p,i)=>`<span><i style="background:${p.color||PALETTE[i%PALETTE.length]}"></i>${escapeHtml(p.name)}</span>`).join("");
}

/* ---------- battle report ---------- */
function buildReportText(players, rounds, adjust, winRule, endScore, rules, timeStr, name){
  const saved = state;
  state = { players: players.map(p=>({name:p.name})), rounds: rounds.map(r=>({pts:r.pts, cabo:r.cabo, kami:r.kami})), adjust: adjust||players.map(()=>0), rules, hundredUsed: players.map(()=>false), winRule, endScore };
  const ts = totals();
  const order = players.map((_,i)=>i).sort((a,b)=> winRule==="low" ? ts[a]-ts[b] : ts[b]-ts[a]);
  const winner = players[order[0]].name;
  const eggs = computeTotals().eggs||[];
  state = saved;
  const lines = [];
  lines.push(t("🃏 卡波计分 · 战报"));
  if(name) lines.push(t("对局：") + name);
  lines.push(t("对局时间：") + timeStr);
  lines.push(t("玩家人数：") + players.length + t(" 人"));
  lines.push(t("规则：") + (winRule==="low"?"低分胜":"高分胜") + t(" · 结束线 ") + endScore + t(" 分"));
  lines.push(t("总轮数：") + rounds.length + t(" 局"));
  lines.push("");
  lines.push(t("🏆 最终排名："));
  order.forEach((i,pos)=> lines.push(`  ${pos+1}. ${players[i].name} — ${ts[i]}${t(`分`)}`));
  lines.push("");
  lines.push(t("🎉 获胜：") + winner);
  const evLines = [];
  const kamiPlayers = [...new Set(rounds.filter(r=> r.kami!=null).map(r=> players[r.kami].name))];
  if(kamiPlayers.length) evLines.push(t("神风特攻队：") + kamiPlayers.join(t("、")) + t(" 触发"));
  const caboRounds = rounds.map((r,ri)=> ({r,ri})).filter(x=> x.r.cabo!=null);
  caboRounds.forEach(({r,ri})=>{
    const c = r.cabo;
    const raw = r.pts;
    const min = Math.min(...raw);
    const ties = raw.filter(v=> v===min).length;
    const isMin = raw[c] === min;
    let desc = isMin ? (ties>1 ? "并列最低" : "成功") : t("失败（+") + rules.caboPenalty + t("）");
    evLines.push(`${t(`CABO 喊话：`)}${players[c].name} ${desc}`);
  });
  const hundredPlayers = [...new Set(eggs.map(e=> players[e.player].name))];
  if(hundredPlayers.length) evLines.push(t("得分满减：") + hundredPlayers.join(t("、")) + t(" 已使用"));
  if(evLines.length){
    lines.push("");
    lines.push(t("📜 规则战报："));
    evLines.forEach(s=> lines.push("  " + s));
  }
  return lines.join("\n");
}

/* ---------- 玩家战绩统计 ---------- */
function computeStats(){
  const {series} = computeTotals();
  const ts = totals();
  const n = state.players.length;
  const rounds = state.rounds;
  const perRound = [];
  let prev = state.players.map(()=>0);
  rounds.forEach((r,k)=>{ const cur = series[k]; perRound.push(state.players.map((_,i)=> cur[i]-prev[i])); prev = cur; });
  const order = state.players.map((_,i)=>i).sort((a,b)=> state.winRule==="low" ? ts[a]-ts[b] : ts[b]-ts[a]);
  return state.players.map((p,i)=>{
    const deltas = perRound.map(d=> d[i]);
    const avg = deltas.length ? Math.round(deltas.reduce((a,b)=>a+b,0)/deltas.length) : 0;
    let best = null;
    if(deltas.length){ best = state.winRule==="low" ? Math.min.apply(null,deltas) : Math.max.apply(null,deltas); }
    const caboRounds = rounds.filter(r=> r.cabo===i);
    const caboOk = caboRounds.filter(r=>{ const raw = state.players.map((_,j)=> (r.pts&&r.pts[j])||0); return raw[i]===Math.min.apply(null,raw); }).length;
    const kami = rounds.filter(r=> r.kami===i).length;
    return { name:p.name, color:p.color, total:ts[i], rank:order.indexOf(i)+1, avg, best, caboCalls:caboRounds.length, caboOk, kami };
  });
}
function openStats(){
  const s = computeStats();
  const rows = s.map(x=>`
    <div class="stat-row" style="border-left:5px solid ${x.color}">
      <div class="stat-name">${escapeHtml(x.name)}${t(`</div> <div class="stat-grid"> <span>总分</span><b>`)}${x.total}${t(`</b> <span>当前排名</span><b>#`)}${x.rank}${t(`</b> <span>平均 / 局</span><b>`)}${x.avg>=0?'+':''}${x.avg}${t(`</b> <span>最佳单局</span><b>`)}${x.best==null?'—':(x.best>=0?'+':'')+x.best}${t(`</b> <span>喊 Cabo</span><b>`)}${x.caboCalls}${t(`次（成功`)}${x.caboOk}${t(`）</b> <span>神风特攻队</span><b>`)}${x.kami}${t(`次</b> </div> </div>`)}`).join("");
  overlay.innerHTML = `${t(`<div class="modal"> <h2>🏅 玩家战绩</h2> <div class="stat-list">`)}${rows || t('<div style="color:var(--muted)">还没有提交过局数</div>')}${t(`</div> <div class="modal-actions"><button class="primary" id="stClose">关闭</button></div> </div>`)}`;
  overlay.classList.remove("hidden");
  document.querySelector("#stClose").onclick = ()=> overlay.classList.add("hidden");
}

function createMqtt(brokers, opts){

  function parseRemLen(view, start){ var mult=1, value=0, i=start, bytes=0; while(true){ var b=view[i]; bytes++; value += (b & 127)*mult; mult*=128; i++; if((b & 128)===0) break; if(bytes>=4) break; } return { value:value, bytes:bytes }; }

    else if(type === 0x90){ /* SUBACK */ }
    else if(type === 0x30 || type === 0x32 || type === 0x34 || type === 0x36){ var tl = (pkt[hl]<<8) | pkt[hl+1]; var off = hl+2; var topic = dec.decode(pkt.subarray(off, off+tl)); off += tl; var qos = (pkt[0]>>1)&3; if(qos>0) off += 2; var payload = dec.decode(pkt.subarray(off)); if(opts.onMessage) opts.onMessage(topic, payload); }

        room._retainRcvd = false;
        room._seenRev = room.rev;          // 目前从服务端见过的最高版本
        room._origRev = room.rev;          // 重连前本地版本
        clearTimeout(room._reconcileTimer);
        room._reconcileTimer = setTimeout(function(){
          room._reconcileTimer = null;
          if(room._retainRcvd){
            // 服务端有数据：更新已被应用则无需再推；仅当本地确有未同步改动时才回推
            if(room._dirty && room._seenRev <= room._origRev) roomMqttPublish();
            else room._dirty = false;
          } else {
            // 服务端为空（全新/无人）：房主或有本地数据者种子化，让队友能加入
            if(room.isCreator || room._dirty || (state && (state.started || (state.rounds && state.rounds.length)))) roomMqttPublish();
          }
        }, 1200);
      } else { roomStartFallbackPoll(); }
      roomRefreshStatus();
    },
    onMessage: function(topic, payloadStr){
      if(topic !== mqttTopic) return;
      try{
        var msg = JSON.parse(payloadStr);
      if(msg && msg.by && msg.by !== DEVICE_ID && msg.state){
        room._retainRcvd = true;
        if((msg.rev||0) > (room._seenRev||0)) room._seenRev = msg.rev;
        // 准入守卫：被踢设备 / 非登录用户(loginOnly) / 锁定后非成员 → 一律忽略其推送
        if(roomMsgBlocked(msg.by, msg.who)) return;
        // 只接受别的设备推来、且版本更新的数据（防止用旧数据覆盖队友）
        if((msg.rev||0) > (room.rev||0)){
          applyingRemote = true;
          try{ state = msg.state; normalize(); render(); room.rev = msg.rev; roomSaveLocal(); }
          finally{ applyingRemote = false; }
          roomCheckSelfKicked();
        }
      }
      }catch(e){}
    }
  });
  mqttClient.connect();
}
function roomMqttPublish(){
  if(mqttClient && mqttConnected && mqttTopic){
    if(roomIsReadOnly()) return false;   // 只读成员不推送
    try{
      memberSelfTouch();                 // 心跳：让队友看到我在线
      room.rev = Math.max((room.rev||0) + 1, Date.now());
      mqttClient.publish(mqttTopic, JSON.stringify({ by: DEVICE_ID, who:{name:myDisplayName(), login:isLoggedIn()}, rev: room.rev, at: Date.now(), state: state }), true);
      room._dirty = false;

    }catch(e){ return false; }
  }

}
function roomStartFallbackPoll(){

function roomBtnLabel(){ return room && room.code ? (t("📡 房间 ") + room.code) : "📡 联机房间"; }
function genRoomCode(){
  let s = "";

    const a = new Uint32Array(6); crypto.getRandomValues(a);
    for(let i=0;i<6;i++) s += ROOM_CHARS[a[i] % ROOM_CHARS.length];

}

async function roomPush(){

async function roomPull(){

function roomStopPoll(){ if(room.timer){ clearInterval(room.timer); room.timer = null; } }
/* Gist 周期备份：仅当 MQTT 在线且数据有变动时，每 60s 落盘一次，供「续局/换设备」恢复；
   平时实时同步走 MQTT，避免每次改动都写 Gist 触发 429 限流。 */
function roomStartBackup(){

    if(room.code && mqttConnected && room.rev !== room._gistRev) roomGistBackup();
  }, 60000);
}
function roomStopBackup(){ if(room.backupTimer){ clearInterval(room.backupTimer); room.backupTimer = null; } }
async function roomGistBackup(){
  if(!room || !room.code || roomIsReadOnly()) return;

    await ghWriteFile(roomFile(room.code), JSON.stringify({ rev: room.rev, by:DEVICE_ID, who:{name:myDisplayName(), login:isLoggedIn()}, at:Date.now(), state:state }));
    room._gistRev = room.rev;
  }catch(e){}
}
async function roomCreate(){

  room.code = genRoomCode(); room.rev = 0; room.err = null; room.isCreator = true;
  // 本地版无账号体系，故新房默认不开「仅登录用户」（否则自己也进不来）；房主为本机
  state.lock = {locked:false, loginOnly:false, owner:DEVICE_ID, banned:[],
                members:[{id:DEVICE_ID, name:myDisplayName(), login:isLoggedIn(), at:Date.now()}]};
  try{ await roomPush(); }catch(e){ room.err = e.message; } // Gist 种子尽力而为，实时靠 MQTT
