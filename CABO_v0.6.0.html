async function roomJoin(code, creator){
  if(room.code) roomLeave();   // 先销毁旧房间监听，再连接新房间
  code = String(code||"").trim().toUpperCase();
  room.isCreator = !!creator;
  if(!ROOM_RE.test(code)) throw new Error(t("房间码为 6 位，只含数字 2-9 与字母（不含 I、O）"));
  let d = null;
  try{ const c = await ghReadFile(roomFile(code)); if(c){ try{ d = JSON.parse(c); }catch(e){} } }catch(e){}
  if(d && d.state){
    // 准入判定要在覆盖本地对局之前做：被踢过 / 房间仅限登录用户 → 直接拒绝
    const _lk = d.state.lock || {};
    const _bn = Array.isArray(_lk.banned) ? _lk.banned : [];
    for(let _i=0;_i<_bn.length;_i++){
      const _b = _bn[_i];
      const _bid = (typeof _b === "string") ? _b : String((_b && _b.id) || "");
      const _bnm = (_b && _b.name) ? String(_b.name) : "";
      if((_bid && _bid === DEVICE_ID) || (_bnm && myLoginName() && _bnm === myLoginName())){
        room.code = null; room.rev = 0;
        throw new Error(t("你已被房主移出该房间，无法再次加入"));
      }
    }
    if(_lk.loginOnly && !isLoggedIn()){
      room.code = null; room.rev = 0;
      throw new Error(t("该房间仅限已登录用户加入。本地版没有账号，请改用在线版并登录后再加入"));
    }
    room.code = code; room.rev = d.rev || 0; room.err = null; state = d.state; normalize(); render();
    // 成员维护：未锁定则把本机登记为成员；锁定则非成员视为只读
    if(!state.lock.locked) memberSelfTouch();
    roomSaveLocal();
  }
  else { room.code = code; room.rev = 0; room.err = null; }
  roomMqttConnect(code);
  roomStartFallbackPoll();
  // 加入成功后广播一次，让房主的成员列表立刻出现我
  if(d && !roomIsReadOnly()){ try{ memberSelfTouch(); save(); }catch(e){} }
  // 无 Gist 种子时，等一小段时间看 MQTT 是否推来回旋/实时数据；都没有则判定房间不存在
  if(!d){
    await new Promise(function(res){ setTimeout(res, 2000); });
    if(mqttConnected && room.rev > 0){ return; }
    roomStopPoll();
    if(mqttClient){ try{ mqttClient.close(); }catch(e){} mqttClient = null; }
    mqttConnected = false;
    room.code = null; room.rev = 0;
    throw new Error(t("房间不存在，请核对房间码"));
  }
}
function roomLeave(){

  mqttConnected = false;
  room.code = null; room.rev = 0; room.err = null;

/* ===== 房间成员名单 / 准入控制 =====
   本地版无账号体系：本机恒为「未登录」，因此无法加入云端版创建的「仅登录用户」房间。
   数据层三重守卫：① 被踢设备(banned) ② 仅登录用户(loginOnly) ③ 锁定后非成员(locked) */
function myLoginName(){ return ""; }                     // 本地版无账户
function isLoggedIn(){ return false; }
function myNick(){ try{ return String(localStorage.getItem("cabo-nick") || ""); }catch(e){ return ""; } }
function myDisplayName(){ return myLoginName() || myNick() || (t("设备") + String(DEVICE_ID).slice(-4)); }
function lockObj(){
  if(!state.lock || typeof state.lock !== "object") state.lock = {locked:false, loginOnly:false, owner:"", members:[], banned:[]};
  if(!Array.isArray(state.lock.members)) state.lock.members = [];
  if(!Array.isArray(state.lock.banned)) state.lock.banned = [];

}
function memberFind(id){ const L = lockObj(); for(let i=0;i<L.members.length;i++){ if(L.members[i].id === id) return L.members[i]; } return null; }
function memberHas(id){ return !!memberFind(id); }
function memberTouch(id, name, login){
  const L = lockObj(); const m = memberFind(id);
  if(m){ if(name) m.name = name; m.login = !!login; m.at = Date.now(); return false; }
  L.members.push({id:id, name:name||"", login:!!login, at:Date.now()}); return true;

function memberSelfTouch(){ return memberTouch(DEVICE_ID, myDisplayName(), isLoggedIn()); }
function isBanned(id, name){
  const L = lockObj();
  for(let i=0;i<L.banned.length;i++){
    const b = L.banned[i];

    if(b.name && name && b.name === name) return true;
  }

}

function roomCheckSelfKicked(){

    <div class="room-qr">${qr}${t(`</div> <div style="text-align:center"><span class="room-status" id="roomStat">🟢 实时已连接（毫秒级）</span></div> <div class="room-link">`)}${escapeHtml(link)}${t(`</div> <div class="action-row" style="margin-top:14px"> <button class="ghost" id="roomCopyCode">📋 复制房间码</button> <button class="ghost" id="roomCopy">📋 复制链接</button> </div> <div class="action-row"> <button class="ghost" id="roomSyncNow">⬇ 强制同步</button>`)}${lockBtn}
    </div>
    <div class="action-row">${loginBtn}</div>
    ${roomMembersHtml()}
    ${readOnly ? '<div class="room-hint" style="color:var(--danger);text-align:center">⚠ 你当前没有改分权限（只读）：可能已被房主移出、本房间仅限登录用户（本地版无账号）、或房间已锁定且你不在成员名单。</div>' : ''}${t(`<button class="ghost" id="roomLeave" style="width:100%;margin-top:10px;color:var(--danger)">🚪 退出房间</button>`)}`;
}

function bindRoomPanel(){
  const close = document.querySelector("#roomClose");
  if(close) close.onclick = ()=> overlay.classList.add("hidden");
  const redraw = ()=>{
    const body = document.querySelector("#roomBody");
    if(body){ body.innerHTML = roomPanelHtml(); bindRoomPanel(); }
  };
  const cr = document.querySelector("#roomCreate");
  if(cr) cr.onclick = async ()=>{
    cr.disabled = true; cr.textContent = t("创建中…");
    try{ const code = await roomCreate(); toast(t("房间已创建：") + code); redraw(); render(); }
    catch(e){ toast(t("创建失败：") + roomErrMsg(e)); cr.disabled = false; cr.textContent = t("➕ 创建房间"); }
  };
  const jb = document.querySelector("#roomJoinBtn");
  if(jb) jb.onclick = async ()=>{
    const inp = document.querySelector("#roomInput");
    const code = inp ? inp.value : "";

    try{ await roomJoin(code); toast(t("已加入房间 ") + room.code); redraw(); }
    catch(e){ toast(e.message); jb.disabled = false; jb.textContent = t("🔑 加入房间"); }
  };
  const cp = document.querySelector("#roomCopy");
  if(cp) cp.onclick = ()=>{
    const url = roomLink(room.code);
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(()=> toast(t("邀请链接已复制"))).catch(()=> prompt(t("复制此链接："), url));
    else prompt(t("复制此链接："), url);
  };
  const sn = document.querySelector("#roomSyncNow");
  if(sn) sn.onclick = async ()=>{ sn.disabled = true; sn.textContent = t("同步中…"); await roomForceSync(); sn.disabled = false; sn.textContent = t("⬇ 强制同步"); };
  const rc = document.querySelector("#roomCopyCode");
  if(rc) rc.onclick = ()=>{
    const code = room.code || "";
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=> toast(t("房间码已复制：") + code)).catch(()=> prompt(t("复制此房间码："), code));
    else prompt(t("复制此房间码："), code);
  };
  const rlk = document.querySelector("#roomLock");
  if(rlk) rlk.onclick = async ()=>{ await roomToggleLock(); redraw(); };
  const rcn = document.querySelector("#roomReconnect");
  if(rcn) rcn.onclick = async ()=>{ rcn.disabled = true; rcn.textContent = t("重连中…"); await roomReconnect(); redraw(); };
  const lo = document.querySelector("#roomLoginOnly");
  if(lo) lo.onclick = async ()=>{ await roomToggleLoginOnly(); redraw(); };
  // 踢人：行内二次确认，避免误触（不用弹窗，弹窗会顶掉房间面板）
  const kicks = document.querySelectorAll("[data-kick]");
  for(let i=0;i<kicks.length;i++){
    (function(btn){
      btn.onclick = function(){
        if(btn.getAttribute("data-sure") === "1"){ roomKick(btn.getAttribute("data-kick")); redraw(); return; }
        btn.setAttribute("data-sure", "1"); btn.textContent = t("确认踢出?");
        setTimeout(function(){ try{ btn.setAttribute("data-sure",""); btn.textContent = t("踢出"); }catch(e){} }, 3000);
      };
    })(kicks[i]);
  }
  const unbans = document.querySelectorAll("[data-unban]");
  for(let i=0;i<unbans.length;i++){
    (function(btn){ btn.onclick = function(){ roomUnban(btn.getAttribute("data-unban")); redraw(); }; })(unbans[i]);
  }
  const nkb = document.querySelector("#mbNickSave");
  if(nkb) nkb.onclick = ()=>{
    const el = document.querySelector("#mbNick");
    const v = el ? String(el.value||"").trim() : "";
    try{ localStorage.setItem("cabo-nick", v); }catch(e){}
    if(room.code && !roomIsReadOnly()){ memberSelfTouch(); save(); }
    toast(v ? (t("显示名已设为：") + v) : "已清空显示名");
    redraw();
  };
  const lv = document.querySelector("#roomLeave");
  if(lv) lv.onclick = ()=>{ roomLeave(); overlay.classList.add("hidden"); toast(t("已退出房间")); };
}
function roomBoot(){
  const h = location.hash || "";
  if(h.indexOf("#r=") === 0){
    const code = h.slice(3).trim().toUpperCase();
    if(ROOM_RE.test(code)){
      askConfirm(t("加入联机房间"), t("检测到房间码 ") + code + t("，加入后会载入房间里的对局（覆盖当前对局）。确定加入？"), async ()=>{
        try{ await roomJoin(code); toast(t("已加入房间 ") + code); }
        catch(e){ toast(t("加入失败：") + roomErrMsg(e)); }
      });
      return;
    }
  }
  try{
    const o = JSON.parse(localStorage.getItem(ROOM_KEY));
    if(o && o.code && ROOM_RE.test(o.code)){ room.code = o.code; room.rev = o.rev || 0; roomMqttConnect(o.code); roomStartFallbackPoll(); render(); }
  }catch(e){}
}
/* ===== 内嵌二维码生成器（byte mode / EC-M / 版本1-10 自动选择，无外部依赖） ===== */
var CABOQR = (function(){
  var EXP = new Array(256), LOG = new Array(256);
  for(var i=0;i<8;i++) EXP[i] = 1<<i;
  for(var i=8;i<256;i++) EXP[i] = EXP[i-4]^EXP[i-5]^EXP[i-6]^EXP[i-8];
  for(var i=0;i<255;i++) LOG[EXP[i]] = i;
  function gexp(n){ while(n<0) n+=255; while(n>=256) n-=255; return EXP[n]; }
  function gmul(a,b){ return (a===0||b===0) ? 0 : gexp(LOG[a]+LOG[b]); }

  // EC 级别 M 的 RS 分块表：[块数, 块内总码字, 块内数据码字]
  var RS = {
    1:[[1,26,16]], 2:[[1,44,28]], 3:[[1,70,44]], 4:[[2,50,32]], 5:[[2,67,43]],
    6:[[4,43,27]], 7:[[4,49,31]], 8:[[2,60,38],[2,61,39]],
    9:[[3,58,36],[2,59,37]], 10:[[4,69,43],[1,70,44]]
  };
  var ALIGN = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
               7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};

  function dataCapacity(v){
    var n = 0; RS[v].forEach(function(b){ n += b[0]*b[2]; }); return n;
  }
  function rsGenPoly(ecLen){
    var poly = [1];
    for(var i=0;i<ecLen;i++){
      var next = new Array(poly.length+1);
      for(var k=0;k<next.length;k++) next[k]=0;
      for(var j=0;j<poly.length;j++){
        next[j]   ^= poly[j];
        next[j+1] ^= gmul(poly[j], gexp(i));
      }
      poly = next;
    }
    return poly;
  }
  function rsEncode(data, ecLen){
    var gen = rsGenPoly(ecLen);
    var res = data.slice();
    for(var i=0;i<ecLen;i++) res.push(0);
    for(var i=0;i<data.length;i++){
      var coef = res[i];
      if(coef !== 0){
        for(var j=0;j<gen.length;j++) res[i+j] ^= gmul(gen[j], coef);
      }
    }
    return res.slice(data.length);
  }
  function utf8Bytes(str){
    var out = [];
    for(var i=0;i<str.length;i++){
      var c = str.charCodeAt(i);
      if(c < 0x80) out.push(c);
      else if(c < 0x800){ out.push(0xc0|(c>>6), 0x80|(c&0x3f)); }
      else if(c >= 0xd800 && c <= 0xdbff && i+1 < str.length){
        var c2 = str.charCodeAt(i+1);
        var cp = 0x10000 + ((c-0xd800)<<10) + (c2-0xdc00); i++;
        out.push(0xf0|(cp>>18), 0x80|((cp>>12)&0x3f), 0x80|((cp>>6)&0x3f), 0x80|(cp&0x3f));
      }
      else { out.push(0xe0|(c>>12), 0x80|((c>>6)&0x3f), 0x80|(c&0x3f)); }
    }
    return out;
  }
  function pickVersion(byteLen){
    for(var v=1; v<=10; v++){
      var countBits = v < 10 ? 8 : 16;
      var need = 4 + countBits + byteLen*8;
      if(dataCapacity(v)*8 >= need) return v;
    }
    return null; // 超出支持范围
  }
  function buildCodewords(bytes, v){
    var bits = [];
    function push(val, len){ for(var i=len-1;i>=0;i--) bits.push((val>>i)&1); }
    push(4, 4);                              // byte mode
    push(bytes.length, v < 10 ? 8 : 16);     // 字符计数
    for(var i=0;i<bytes.length;i++) push(bytes[i], 8);
    var cap = dataCapacity(v)*8;
    for(var i=0;i<4 && bits.length<cap;i++) bits.push(0);   // 终止符
    while(bits.length % 8 !== 0) bits.push(0);
    var data = [];
    for(var i=0;i<bits.length;i+=8){
      var b = 0; for(var j=0;j<8;j++) b = (b<<1)|bits[i+j];
      data.push(b);
    }
    var pad = [0xEC, 0x11], pi = 0;
    while(data.length < dataCapacity(v)) data.push(pad[pi++ % 2]);
    // 分块 + RS 纠错
    var blocks = [], off = 0;
    RS[v].forEach(function(spec){
      for(var n=0;n<spec[0];n++){
        var d = data.slice(off, off+spec[2]); off += spec[2];
        blocks.push({ d:d, e:rsEncode(d, spec[1]-spec[2]) });
      }
    });
    var maxD = 0, maxE = 0;
    blocks.forEach(function(b){ maxD = Math.max(maxD,b.d.length); maxE = Math.max(maxE,b.e.length); });
    var out = [];
    for(var i=0;i<maxD;i++) blocks.forEach(function(b){ if(i<b.d.length) out.push(b.d[i]); });
    for(var i=0;i<maxE;i++) blocks.forEach(function(b){ if(i<b.e.length) out.push(b.e[i]); });
    return out;
  }
  function bchDigit(d){ var n=0; while(d!==0){ n++; d>>>=1; } return n; }
  var G15 = (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
  var G15_MASK = (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
  var G18 = (1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
  function bchTypeInfo(d){
    var x = d << 10;
    while(bchDigit(x) - bchDigit(G15) >= 0) x ^= (G15 << (bchDigit(x)-bchDigit(G15)));
    return ((d<<10)|x) ^ G15_MASK;
  }
  function bchTypeNumber(d){
    var x = d << 12;
    while(bchDigit(x) - bchDigit(G18) >= 0) x ^= (G18 << (bchDigit(x)-bchDigit(G18)));
    return (d<<12)|x;
  }
  function maskFn(p,i,j){
    switch(p){
      case 0: return (i+j)%2===0;
      case 1: return i%2===0;
      case 2: return j%3===0;
      case 3: return (i+j)%3===0;
      case 4: return (Math.floor(i/2)+Math.floor(j/3))%2===0;
      case 5: return (i*j)%2+(i*j)%3===0;
      case 6: return ((i*j)%2+(i*j)%3)%2===0;
      default: return ((i*j)%3+(i+j)%2)%2===0;
    }
  }
  function makeMatrix(v, mask, cw){
    var size = v*4+17;
    var m = [];
    for(var r=0;r<size;r++){ m.push(new Array(size)); for(var c=0;c<size;c++) m[r][c]=null; }
    function finder(row, col){
      for(var r=-1;r<=7;r++) for(var c=-1;c<=7;c++){
        if(row+r<0||size<=row+r||col+c<0||size<=col+c) continue;
        m[row+r][col+c] = (0<=r&&r<=6&&(c===0||c===6)) || (0<=c&&c<=6&&(r===0||r===6)) || (2<=r&&r<=4&&2<=c&&c<=4);
      }
    }
    finder(0,0); finder(size-7,0); finder(0,size-7);
    // 对齐图案
    var pos = ALIGN[v];
    for(var a=0;a<pos.length;a++) for(var b=0;b<pos.length;b++){
      var r0=pos[a], c0=pos[b];
      if(m[r0][c0] !== null) continue;
      for(var dr=-2;dr<=2;dr++) for(var dc=-2;dc<=2;dc++)
        m[r0+dr][c0+dc] = (Math.abs(dr)===2||Math.abs(dc)===2||(dr===0&&dc===0));
    }
    // 定位时序
    for(var i=8;i<size-8;i++){
      if(m[6][i]===null) m[6][i] = (i%2===0);
      if(m[i][6]===null) m[i][6] = (i%2===0);
    }
    // 版本信息（v>=7）
    if(v >= 7){
      var vb = bchTypeNumber(v);
      for(var i=0;i<18;i++){
        var mod = ((vb>>i)&1)===1;
        m[Math.floor(i/3)][i%3+size-8-3] = mod;
        m[i%3+size-8-3][Math.floor(i/3)] = mod;
      }
    }
    // 格式信息（EC-M => 0）
    var fb = bchTypeInfo((0<<3)|mask);
    for(var i=0;i<15;i++){
      var mod = ((fb>>i)&1)===1;
      if(i<6) m[i][8] = mod;
      else if(i<8) m[i+1][8] = mod;
      else m[size-15+i][8] = mod;
      if(i<8) m[8][size-i-1] = mod;
      else if(i<9) m[8][15-i-1+1] = mod;
      else m[8][15-i-1] = mod;
    }
    m[size-8][8] = true; // 固定黑点
    // 数据填充
    var inc = -1, row = size-1, bitIdx = 7, byteIdx = 0;
    for(var col = size-1; col > 0; col -= 2){
      if(col === 6) col--;
      for(;;){
        for(var c=0;c<2;c++){
          if(m[row][col-c] === null){
            var dark = false;
            if(byteIdx < cw.length) dark = ((cw[byteIdx] >>> bitIdx) & 1) === 1;
            if(maskFn(mask, row, col-c)) dark = !dark;
            m[row][col-c] = dark;
            bitIdx--;
            if(bitIdx === -1){ byteIdx++; bitIdx = 7; }
          }
        }
        row += inc;
        if(row < 0 || size <= row){ row -= inc; inc = -inc; break; }
      }
    }
    return m;
  }
  function lostPoint(m){
    var size = m.length, lost = 0, r, c;
    for(r=0;r<size;r++) for(c=0;c<size;c++){
      var same = 0, dark = m[r][c];
      for(var dr=-1;dr<=1;dr++){
        if(r+dr<0||size<=r+dr) continue;
        for(var dc=-1;dc<=1;dc++){
          if(c+dc<0||size<=c+dc) continue;
          if(dr===0&&dc===0) continue;
          if(dark === m[r+dr][c+dc]) same++;
        }
      }
      if(same > 5) lost += 3 + same - 5;
    }
    for(r=0;r<size-1;r++) for(c=0;c<size-1;c++){
      var cnt = 0;
      if(m[r][c]) cnt++; if(m[r+1][c]) cnt++; if(m[r][c+1]) cnt++; if(m[r+1][c+1]) cnt++;
      if(cnt===0||cnt===4) lost += 3;
    }
    for(r=0;r<size;r++) for(c=0;c<size-6;c++)
      if(m[r][c]&&!m[r][c+1]&&m[r][c+2]&&m[r][c+3]&&m[r][c+4]&&!m[r][c+5]&&m[r][c+6]) lost += 40;
    for(c=0;c<size;c++) for(r=0;r<size-6;r++)
      if(m[r][c]&&!m[r+1][c]&&m[r+2][c]&&m[r+3][c]&&m[r+4][c]&&!m[r+5][c]&&m[r+6][c]) lost += 40;
    var dc2 = 0;
    for(c=0;c<size;c++) for(r=0;r<size;r++) if(m[r][c]) dc2++;
    lost += (Math.abs(100*dc2/size/size - 50)/5)*10;
    return lost;
  }
  function make(text){
    var bytes = utf8Bytes(text);
    var v = pickVersion(bytes.length);
    if(!v) return null;                      // 内容过长
    var cw = buildCodewords(bytes, v);
    var best = null, bestScore = Infinity;
    for(var mask=0; mask<8; mask++){
      var m = makeMatrix(v, mask, cw);
      var s = lostPoint(m);
      if(s < bestScore){ bestScore = s; best = m; }
    }
    return best;
  }
  function svg(text, px, quiet){
    var m = make(text);
    if(!m) return null;
    quiet = (quiet==null) ? 4 : quiet;
    var size = m.length, total = size + quiet*2, path = "";
    for(var r=0;r<size;r++) for(var c=0;c<size;c++)
      if(m[r][c]) path += "M"+(c+quiet)+" "+(r+quiet)+"h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" width="'+px+'" height="'+px+t('" shape-rendering="crispEdges" role="img" aria-label="二维码">')
         + '<rect width="'+total+'" height="'+total+'" fill="#ffffff"/><path d="'+path+'" fill="#000000"/></svg>';
  }
  return { make: make, svg: svg };
})();
